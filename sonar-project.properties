# SonarCloud configuration for libgen-mcp

sonar.projectKey=jmrplens_libgen-mcp2
sonar.organization=jmrplens
sonar.projectName=libgen-mcp

# Declared rather than left to the scanner's platform default, which is what it
# falls back to and warns about. Every tracked text file in this repository is
# UTF-8 or ASCII with no BOM, verified over the whole tree, so there is one
# right answer and no reason to make the scanner guess it.

# Source and test directories
sonar.sourceEncoding=UTF-8
sonar.sources=cmd,internal
sonar.tests=internal
sonar.test.inclusions=**/*_test.go

# Coverage report (generated by CI)
sonar.go.coverage.reportPaths=coverage.out

# cmd/server and cmd/internal are measured; the rest of cmd/ is not.
#
# The original exclusion covered all of cmd/ on the premise that it was thin
# wiring, and that premise expired: cmd/server now decides cross-origin access,
# answers both preflights and mounts the middleware chain on the request path —
# the code most worth measuring, and the one file the metric could not see. It
# sits at 94% from unit tests alone, so nothing here is being lowered to fit.
#
# cmd/internal is measured for a different reason: it is library code that the
# generators share, and it sits at 97%. It was reported as 0% for one release —
# not because it was untested, but because narrowing this exclusion without
# widening -coverpkg left it counted and uninstrumented, which is the worst of
# both. A package belongs in exactly one of the two lists.
#
# The generators and cmd/probe stay excluded on their own merits: they are build
# tooling and a live-network diagnostic whose value is in the artifacts they
# produce, gated by the check-* targets rather than by a coverage number. They
# are still analyzed for issues.
sonar.coverage.exclusions=cmd/probe/**,cmd/gen_*/**,cmd/audit_*/**,cmd/godoc_tool/**,cmd/eval/**,cmd/format_md_tables/**

# Excluded from analysis:
#  - VERSION: non-code file (triggers the C/C++ analyzer).
#  - **/testdata/**: captured HTML/JSON fixtures for the parser tests. They are
#    external site captures, not project source; two search pages share ~90% of
#    the LibGen page chrome, which otherwise dominates the duplication metric.
#  - internal/toolutil/icons/webp/**: the generated 16x16 WebP icon fallbacks.
#    They are committed binaries that happen to live under internal/ rather than
#    in testdata, so nothing else excluded them, and the scanner was reading
#    eighteen WebP files as source text — which is what "problems with file
#    encoding in the source code" meant. They are generated by cmd/gen_icon_webp
#    and gated byte for byte by make check-icon-webp, which is the right check
#    for an image and the only one that would catch a bad one.
sonar.exclusions=VERSION,**/testdata/**,internal/toolutil/icons/webp/**

# ── Rule exclusions for Go test files (idiomatic patterns Sonar over-flags) ──
sonar.issue.ignore.multicriteria=t1,t2,t3,t4,g1

# S1192 — duplicated string literals in table-driven tests / httptest mocks
sonar.issue.ignore.multicriteria.t1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*_test.go

# S1186 — empty function body (httptest handler mocks)
sonar.issue.ignore.multicriteria.t2.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*_test.go

# S100 — Go test names use underscores (TestFoo_Bar)
sonar.issue.ignore.multicriteria.t3.ruleKey=go:S100
sonar.issue.ignore.multicriteria.t3.resourceKey=**/*_test.go

# S3776 — cognitive complexity in test helpers
sonar.issue.ignore.multicriteria.t4.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.t4.resourceKey=**/*_test.go

# S1135 — TODO/FIXME tracking annotations are not quality issues
sonar.issue.ignore.multicriteria.g1.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.g1.resourceKey=**/*.go

