# fly.toml — Fly.io deployment for libgen-mcp (public, no auth required)
#
# Deploy: fly deploy
# Logs:   fly logs
# Status: fly status
# Health: curl https://<app-name>.fly.dev/health
# MCP:    https://<app-name>.fly.dev/
#
# libgen-mcp needs NO credentials or token — Library Genesis is public. This is
# an open streamable-HTTP endpoint. Because a hosted server cannot write to the
# client's disk, HTTP mode puts the download tool in remote mode: it returns a
# direct link (a resource_link) for the client to fetch, instead of saving a file.

app = "libgen-mcp"
primary_region = "cdg"

kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VERSION = "1.3.2"

# libgen-mcp takes a single --http <addr> flag (unlike gitlab-mcp-server's
# --http/--http-addr split). Override the Dockerfile ENTRYPOINT args to serve
# streamable HTTP on the internal port. --http implies remote-download mode.
[experimental]
  cmd = ["--http", "0.0.0.0:8080"]

# Replace one machine at a time. With two machines "immediate" swaps both at
# once, so every in-flight MCP session drops together.
[deploy]
  strategy = "rolling"

# Tuning for the deployed guest (see [[vm]] below). The stock defaults are sized
# for a laptop running one user's sessions; this endpoint is shared, so the
# limits that matter are raised deliberately and the one that must NOT be are
# left alone.
[env]
  LIBGEN_MCP_LOG_LEVEL = "info"

  # `read` fetches a file to a temp file before extracting text, and successive
  # pages of one read reuse that fetch. The cache is DISK, not memory — no
  # volume is mounted, so it lives on the machine's ephemeral rootfs (~8 GB,
  # shared with the OS and image). 3 GiB leaves comfortable headroom while being
  # 6× the 512 MiB default.
  #
  # This is the highest-value setting here, and not because of spare capacity:
  # every cache hit is an outbound request to a Library Genesis mirror that does
  # not happen. Given the rate limit below, avoiding a fetch is worth more than
  # being able to run more of them.
  LIBGEN_MCP_READ_CACHE_BYTES = "3221225472"
  # Long enough that a client paging through a book keeps hitting the same
  # fetch, short enough that idle files are reclaimed well before the disk fills.
  LIBGEN_MCP_READ_CACHE_TTL = "30m"

  # Simultaneous fetches. The default of 2 serializes a shared endpoint behind
  # two slots; 8 matches the vCPU count and stays well under the hard cap of 16.
  LIBGEN_MCP_MAX_CONCURRENT_DOWNLOADS = "8"

  # DELIBERATELY MODEST, and the one value not governed by machine size.
  #
  # This limiter is process-global and points at third-party public mirrors, so
  # every user of this endpoint shares it and every request leaves from one Fly
  # IP. Raising it does not consume our capacity — it consumes someone else's,
  # and the failure mode is that IP getting blocked, which takes the endpoint
  # down for everyone rather than making it slower. Two machines each run their
  # own limiter, so the values below are ~4 rps in aggregate.
  #
  # The hard ceiling is 20 rps; treat anything near it as a decision about the
  # mirrors' tolerance, not about the hardware.
  LIBGEN_MCP_RATE_RPS = "2"
  LIBGEN_MCP_RATE_BURST = "4"

# Declared here so the deployed guest is reproducible from the repository. The
# running machines were resized out of band, which meant a recreated machine —
# or a new region — would have come up at the default guest instead.
[[vm]]
  size = "shared-cpu-8x"
  cpu_kind = "shared"
  cpus = 8
  memory = "10gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # One machine stays warm. A cold start costs the first request, and stopping a
  # machine also discards the read cache above — which is what makes a 3 GiB
  # cache worth having in the first place.
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
