packages:
  - .

# Allow native/build scripts for these dependencies (pnpm blocks them by default).
# puppeteer's build fetches the Chromium that pa11y-ci uses for accessibility checks.
allowBuilds:
  esbuild: true
  puppeteer: true
  sharp: true

# Disable pnpm 11's supply-chain release-age gate so deps resolve to published versions.
minimumReleaseAge: 0

# chevrotain 11.1.2 (mermaid's parser) pins lodash-es to exactly 4.17.23, which
# GHSA-r5fr-rjxr-66jc rates high (code injection through _.template). 4.18.1 is
# the fixed release on the same major, and the version mermaid already loads
# through dagre-d3-es, so the override leaves one copy in the tree rather than
# introducing a new one. Drop it once chevrotain releases with the fix.
overrides:
  lodash-es@4.17.23: 4.18.1

# Advisories judged and accepted, each with its reason. This is the only place
# pnpm reads them from: a `pnpm` field in package.json is ignored with a
# warning, so an exception written there looks applied and is not.
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1, symlink path traversal and arbitrary file write, with
    # no fixed release. Its only path here is pa11y-ci > puppeteer >
    # @puppeteer/browsers, which uses it to unpack the Chromium archive
    # puppeteer downloads from Google's own HTTPS endpoint on a developer's
    # machine. CI never runs that download (PUPPETEER_SKIP_DOWNLOAD), nothing
    # it unpacks is attacker-chosen, and none of it reaches the built site.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # basic-ftp <=6.2.0, quadratic CPU in Client.list() parsing an FTP directory
    # listing. The fix is 6.2.1 only, and get-uri, its one consumer here, still
    # declares ^5.3.1 in its latest release (8.0.1), so forcing 6.x would put the
    # package outside the range its own dependant declares. Its only path is
    # pa11y-ci > puppeteer > @puppeteer/browsers > proxy-agent > pac-proxy-agent >
    # get-uri, which reaches FTP only to fetch a PAC file from an ftp:// URL. The
    # Chromium download that path serves goes over HTTPS on a developer's
    # machine, CI never runs it (PUPPETEER_SKIP_DOWNLOAD), and nothing configures
    # an FTP PAC file. Drop this once get-uri accepts basic-ftp 6.2.1.
    - GHSA-c475-qrg2-pj4r
    # http-cache-semantics <=4.2.0, a shared cache honouring max-stale can serve
    # one user's cached response to another, with no fixed release. Astro loads
    # it in one place, the build-time cache of remote images
    # (astro/dist/assets/build/remote.js): a cache private to the machine running
    # the build, holding images fetched for that one build, with no second user
    # to disclose anything to. The site configures no remote images, and the
    # published pages are static files that carry none of it.
    - GHSA-ch52-4w7c-c8xp
