# Dependabot configuration — libgen-mcp
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Go modules (root go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    # Let a release sit for three days before a pull request proposes it.
    #
    # The window is against a compromised or withdrawn publish, which is caught
    # by the ecosystem within hours and days respectively; it is not against an
    # ordinary bug, and it is not a substitute for reading the diff. What is
    # NOT delayed is a genuine security fix: `govulncheck` runs in CI on every
    # pull request and fails on a vulnerability that reaches this module's call
    # graph, whatever Dependabot has or has not proposed yet.
    #
    # `default-days` alone, on every ecosystem: the SemVer sub-keys
    # (`semver-major-days` and friends) are rejected outright for docker, and a
    # configuration file Dependabot refuses stops every update, not just that
    # one.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        applies-to: version-updates
        patterns:
          - "*"

  # Docker (root Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # npm (Astro documentation site under /site)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
