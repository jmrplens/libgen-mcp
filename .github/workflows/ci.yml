# CI pipeline for libgen-mcp
#
# Runs on: every pull request whatever its base branch, pushes to main
# Jobs: test (+coverage gate), build, golangci-lint, godoc, govulncheck, markdown,
#       hadolint, docker build (PR + Docker changes only), docs-site (Astro lint + a11y-less checks)

name: CI

on:
  # Deliberately unfiltered by base branch. A stacked pull request is based on
  # the branch below it rather than on main, so a `branches: [main]` filter
  # silently gives every layer but the bottom one no CI at all — the checks do
  # not fail, they never run, which reads as "nothing to report". Pushes stay
  # filtered: a branch that is not yet a pull request has nothing to gate.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"
  COVERAGE_MIN: "85"

  # Whether this run checks that the committed generated artifacts — llms.txt,
  # llms-full.txt, lhm.plugin.json, tool-schema.json, the evaluator pages and the
  # normalized Markdown tables — are current.
  #
  # They are regenerated once, in the layer that changes the surface, and a lower
  # layer of a stack is not that layer. Every layer of a stacked pull request is
  # built as the whole stack up to it merged into the stack's base, so a bottom
  # layer that adds a tool would have to carry regenerated artifacts describing a
  # surface only the top layer finishes — and a top layer that regenerates them
  # would make every layer below it red. Deferring below the top is what lets a
  # stack land one reviewable layer at a time.
  #
  # The layer is told from its position in the stack, not from its own base
  # branch: GitHub reports base.ref as the stack's base for the bottom layer and
  # as the branch below for the others, while the stack's own position and size
  # are exact. Verified against this repository on 2026-09-16: the payload for a
  # two-layer stack carries stack.position 1 and 2 with stack.size 2. A pull
  # request outside a stack keeps the old rule, deferring whenever its base is
  # not main; a push to main always checks.
  FRESHNESS: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.stack != null && github.event.pull_request.stack.position != github.event.pull_request.stack.size) || (github.event.pull_request.stack == null && github.event.pull_request.base.ref != 'main')) && 'deferred' || 'checked' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      # Before the suite rather than after it, because this is the failure mode
      # that makes a suite report the wrong thing: an abort called from an
      # httptest handler kills that goroutine alone, the client sees a transport
      # error, and the test fails somewhere else entirely.
      - name: No testing.T abort is made off the test goroutine
        run: make check-test-goroutines
      # A theme-named test file hides its tests from a reader looking beside the
      # module, and can hide them from CI too: a coverage_boost_test.go would
      # match a .gitignore coverage_* rule and sit untracked indefinitely.
      - name: Every test file is named after a module it tests
        run: make check-test-file-names
      - name: Run tests with coverage
        run: |
          go test -count=1 -coverpkg=./internal/...,./cmd/server/...,./cmd/internal/... -coverprofile=coverage.out ./cmd/... ./internal/...
          go tool cover -func=coverage.out | grep '^total:'
          # The summary line is anchored: a plain "total" also matches any function
          # whose name contains it, which yields two values and turns the comparison
          # below into an awk syntax error that silently passes the gate.
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage (internal/, cmd/server, cmd/internal): ${COVERAGE}%"
          if [ -z "${COVERAGE}" ]; then
            echo "FAIL: no total coverage line in coverage.out"
            exit 1
          fi
          if ! awk "BEGIN {exit !(${COVERAGE} + 0 >= ${COVERAGE_MIN} + 0)}" 2>/dev/null; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${COVERAGE_MIN}%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% meets minimum ${COVERAGE_MIN}%"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  sonarcloud:
    name: "SA: SonarCloud"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The job now gates every version-bearing manifest, but its name is pinned:
  # "server.json" is a required status check in the branch ruleset, and renaming
  # it here would leave that check pending forever.
  server-json:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      # Covers every manifest that carries the version, not just server.json:
      # lhm.plugin.json and .plugin/plugin.json used to drift unnoticed because
      # nothing in CI ever read them.
      - name: Every version-bearing manifest matches the VERSION file
        run: make check-manifests
      # The stamper writes what the registry serves, and it runs once per
      # release inside the job holding this repository's publishing identities.
      # Two of its rewrites fail in a shape that still reads correctly — an OCI
      # entry stamped with another entry's repository, and a digest-pinned
      # identifier stamped without a digest — so they are driven here, on a
      # fixture, rather than discovered on a tag.
      - name: The release stamper does what server.json's entries need
        run: make check-stamper
      # The published-package verifier gates the two jobs that advertise a
      # release, so it has to tell propagation lag from wrong bytes: the first
      # is waited out, the second is reported on sight. Both directions are
      # pinned offline here, because on a tag the wrong answer is unrecoverable
      # in one direction and invisible in the other.
      - name: The published-package verifier waits out lag and never a mismatch
        run: make check-verify-published
      - name: Validate server.json against the MCP Registry schema
        run: |
          set -euo pipefail
          SCHEMA_URL=$(jq -r '."$schema"' server.json)
          echo "Schema: $SCHEMA_URL"
          # SSRF guard: only the official MCP Registry schema host is allowed.
          ALLOWED_PREFIX="https://static.modelcontextprotocol.io/"
          case "$SCHEMA_URL" in
            "$ALLOWED_PREFIX"*) ;;
            *) echo "::error::Schema URL must start with $ALLOWED_PREFIX (got: $SCHEMA_URL)"; exit 1 ;;
          esac
          # The schema lives on a third-party host, so a blip there must not read
          # as "server.json is invalid": a bare 503 from static.modelcontextprotocol.io
          # already failed this job once. curl retries 5xx/429/timeouts by default
          # once --retry is given.
          curl -fsSL --proto '=https' --tlsv1.2 \
            --retry 5 --retry-delay 3 --retry-connrefused --max-time 60 \
            "$SCHEMA_URL" -o /tmp/mcp-schema.json
          python3 -c "import json,jsonschema; \
            schema=json.load(open('/tmp/mcp-schema.json')); \
            inst=json.load(open('server.json')); \
            jsonschema.validate(inst, schema); \
            print('server.json: VALID')"
      # What the schema above cannot see: that a package declared as "mcpb"
      # points at a raw ELF binary, that an image tag was never pushed or has
      # moved off its digest, or that an npm version is missing the mcpName the
      # registry reads ownership from. Six entries sat in the first of those for
      # twenty tags here, every one of them schema-valid.
      #
      # On pushes only: it downloads tens of MB and talks to three registries,
      # which is worth doing once per merge rather than on every push to every
      # pull request. The job it lives in is already a gate, so a failure here
      # fails the same check.
      - name: Every declared package is published and is what it claims
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-server-json-packages

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Build server and probe
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/probe
      - name: Verify e2e tests compile
        run: go test -tags e2e -c -o /dev/null ./test/e2e/

      # The live e2e suite cannot run here — it depends on third-party mirrors
      # whose outages would be reported as our regressions. This module depends
      # on nothing external: it builds the binary, drives it over a socket, and
      # skips its nginx cases when the runner has no Docker. So unlike the suite
      # above it is compiled *and* run.
      - name: HTTP transport end-to-end
        run: go test -tags httpe2e -count=1 -timeout 900s ./test/e2e/http/
      # The other transport, and the primary one. It builds the binary and
      # drives it over pipes, reaching nothing but the fixtures it starts
      # itself, so it runs here for the same reason the module above does.
      - name: stdio transport end-to-end
        run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/
      - name: Check Markdown tables are formatted
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/format_md_tables/ --check
      - name: Check generated llms files are current
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/gen_llms/ --check

      - name: Evaluator results pages are generated, not hand-edited
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/gen_eval_pages/ --check

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: make golangci-lint

  # An uncredentialed job on purpose: it audits the jobs that *are* credentialed,
  # and a gate that fails must not be able to leak what the jobs behind it hold.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Every action pinned, no run-time-resolved code where the credentials are
        run: make check-supply-chain

  godoc:
    name: godoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Audit godoc coverage (exported symbols, packages and tests)
        run: go run ./cmd/godoc_tool/ audit --include-tests --fail-on-findings
      - name: Audit MCP tool surface quality
        run: make audit-surface-quality

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make govulncheck

  # The release workflow only invokes GoReleaser when a tag is pushed, so a
  # malformed .goreleaser.yml used to surface at the worst possible moment —
  # mid-release, after the tag exists. Validate the config on every PR instead.
  goreleaser-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: check

  # Every doc artifact that is generated from code. Each of these had a
  # `make check-*` target already, but nothing ran them, so the generated
  # regions were free to drift from their sources: the evaluator pages spent
  # several releases claiming 45 scenarios while the tables listed 61.
  generated-docs:
    name: Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Evaluator results pages match the scenario list and the run
        if: env.FRESHNESS == 'checked'
        run: make check-eval-pages
      - name: llms.txt and llms-full.txt match the registered tools
        if: env.FRESHNESS == 'checked'
        run: make check-llms
      # LobeHub reads the capability arrays straight out of lhm.plugin.json — its
      # crawler cannot introspect a Go binary — so a stale manifest publishes the
      # previous release's tool surface to the marketplace with no warning.
      - name: lhm.plugin.json matches the registered tools and prompts
        if: env.FRESHNESS == 'checked'
        run: make check-lhm-manifest
      # The reference tables on the docs site render their names, types and
      # required flags from this file. A stale copy publishes a parameter list
      # that no longer matches what the server accepts.
      - name: tool-schema.json matches the registered surface
        if: env.FRESHNESS == 'checked'
        run: make check-tool-schema
      - name: Markdown tables are normalized
        if: env.FRESHNESS == 'checked'
        run: make check-md-tables
      # Not FRESHNESS-gated, unlike everything above it: those check that a
      # generated file was regenerated, which is the top layer of a stack's job.
      # This checks what a button actually registers, and a button can be edited
      # in any layer — deferring it would let the layer that changes one be the
      # only layer that does not look at it.
      - name: The install buttons agree within each command
        run: make check-install-buttons

  analyze-md:
    name: Analyze Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2 "**/*.md"
      - name: Check local documentation links
        run: make check-doc-links

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3018

  # Both published platforms are built here and, more to the point, started:
  # an image nothing has ever executed on the platform it advertises is not a
  # tested artefact. This job used to build the runner's native platform alone
  # and never run it, which is a shape that cannot see the class of defect the
  # smoke script's header describes — a cross-compiled binary asking for a
  # loader the runtime image does not ship execs fine on amd64 and not at all
  # on arm64.
  #
  # The matrix leg is cheap despite the emulation: Go cross-compiles from the
  # build platform, so only the runtime stage's `apk add` and the `--version`
  # run below go through QEMU. `needs: docker` in the verdict below waits on
  # the whole matrix and reads one result for it, so this stays a single gate.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for Docker changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} -- Dockerfile .dockerignore scripts/smoke-test-image.sh)
          if [ -n "$CHANGED" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "No Docker-related files changed — skipping build"
          fi
      # QEMU so the non-native variant can be executed here, not only built.
      - name: Set up QEMU
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: libgen-mcp:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Smoke test the image
        if: steps.filter.outputs.docker == 'true'
        run: bash scripts/smoke-test-image.sh ci "libgen-mcp:ci=${{ matrix.platform }}"

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
        env:
          # The lint job does not run pa11y, so skip puppeteer's Chromium download.
          # Playwright's browser is a separate install, handled below — Mermaid
          # needs it and puppeteer's copy would not satisfy that.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # rehype-mermaid renders each diagram to inline SVG during the build, which
      # needs a real browser. Same cache key as the Pages workflow, so the two
      # jobs share one download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
      - name: Install Chromium for Mermaid rendering
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      - name: Build the site
        run: pnpm run build
        working-directory: site
      - name: Lint (astro check, i18n parity, eslint, prettier, html-validate, htmlhint)
        run: pnpm run lint
        working-directory: site

  # The unit suite on the platforms this project actually ships binaries for.
  # GoReleaser builds six: linux, darwin and windows by amd64 and arm64, and
  # cmd/server carries platform-constrained source (listen_unix.go against
  # listen_other.go) that only one of them was ever compiling here.
  #
  # It runs on every pull request rather than only on main and at release, which
  # is the more expensive of the two shapes and is the point: a platform failure
  # found after merge is a red main nobody asked for, and the person who can fix
  # it fastest is the one who is still holding the change.
  #
  # Linux is in the matrix as the control. Without it, a macOS-only failure
  # cannot be told apart from a command that would have failed anywhere.
  cross-platform:
    name: Unit suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS bills several times the Linux rate, so a hung test must not sit
    # there for the six-hour default.
    timeout-minutes: 25
    strategy:
      # Every platform reports. Stopping at the first failure hides whether the
      # other two share it, which is the first thing you want to know.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      # The whole suite, tooling under cmd/ included: those commands write the
      # committed artifacts, and a path they only spell correctly on Linux
      # produces a diff nobody can reproduce.
      - run: go test ./... -count=1
      # The stdio module belongs on all three platforms rather than on Linux
      # alone: what it drives is a process, two pipes and a termination signal,
      # and each of those is spelled differently on Windows — the home directory
      # the server resolves its cache through, the console event that stands in
      # for SIGTERM, the executable extension. None of that is exercised by the
      # unit suite above.
      - run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/

  # A cheap type-check of the same targets on a Linux runner, one job per
  # platform, beside the real matrix rather than instead of it.
  #
  # The matrix above is expensive enough that somebody may reasonably narrow it
  # later. This job means narrowing it can never silently take the compile of
  # cmd/server/listen_other.go with it, and it costs seconds.
  cross-compile:
    name: Type-check (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Build
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # vet type-checks the test files too, which go build does not, so a test
      # that only compiles on one platform is caught here rather than in the
      # matrix above.
      - name: Vet, tests included
        run: go vet ./... && go vet -tags httpe2e ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # One check for branch protection to require.
  #
  # Naming every job in the ruleset means a job added later is not a gate until
  # somebody remembers to add it there too, which is a protection that weakens
  # each time the pipeline grows. This job needs them all, so a new job becomes
  # required by being added to its needs list — one edit, in the file the job
  # was added to.
  #
  # always() is what makes it able to report at all: without it the job is
  # skipped the moment anything it needs fails, and a skipped check is not a
  # failing one as far as the ruleset is concerned.
  verdict:
    name: CI verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - test
      - sonarcloud
      - server-json
      - build
      - golangci-lint
      - godoc
      - supply-chain
      - govulncheck
      - goreleaser-config
      - generated-docs
      - analyze-md
      - hadolint
      - docker
      - docs-site
      - cross-platform
      - cross-compile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every job that fed this one must have passed
        run: printf '%s' "$NEEDS" | .github/scripts/needs-verdict.sh "$GITHUB_EVENT_NAME"
        env:
          NEEDS: ${{ toJSON(needs) }}
