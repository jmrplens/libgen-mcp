# CI pipeline for libgen-mcp
#
# Runs on: every pull request whatever its base branch, pushes to main
# Jobs: test (+coverage gate), build, golangci-lint, godoc, govulncheck, release
#       binaries (module-grain advisories, standalone ELF), markdown,
#       hadolint, docker build (PR + Docker changes only), docs-site (Astro lint,
#       dependency audit), pr-description (PR only)

name: CI

on:
  # Deliberately unfiltered by base branch. A stacked pull request is based on
  # the branch below it rather than on main, so a `branches: [main]` filter
  # silently gives every layer but the bottom one no CI at all — the checks do
  # not fail, they never run, which reads as "nothing to report". Pushes stay
  # filtered: a branch that is not yet a pull request has nothing to gate.
  #
  # `edited` is added to the three default types for the pr-description job:
  # the title and body become the squash commit's message, they change without
  # a push, and a review bot writes into the body after the author did. Without
  # it the verdict would keep judging the text the last push saw. It reruns the
  # whole pipeline rather than that one job, because a run that judged only the
  # description would publish a "CI verdict" newer than, and blind to, a red
  # test on the same commit. It also fires when the base branch changes, which
  # is when a stacked layer is retargeted and wants a fresh run anyway.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# One run per pull request at a time. A push or an edit supersedes the run
# before it, so the verdict that stands is always the one that saw the latest
# commit and the latest description; without this, two runs racing on one
# commit could finish in either order and the older text could have the last
# word. Pushes to main are never cancelled: every merge is its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  COVERAGE_MIN: "90"
  # The same exact version release.yml pins, for the Release binaries job's
  # snapshot build. Move the two together.
  GORELEASER_VERSION: "v2.18.2"

  # Whether this run checks that the committed generated artifacts — llms.txt,
  # llms-full.txt, lhm.plugin.json, tool-schema.json, the evaluator pages and the
  # normalized Markdown tables — are current.
  #
  # They are regenerated once, in the layer that changes the surface, and a lower
  # layer of a stack is not that layer. Every layer of a stacked pull request is
  # built as the whole stack up to it merged into the stack's base, so a bottom
  # layer that adds a tool would have to carry regenerated artifacts describing a
  # surface only the top layer finishes — and a top layer that regenerates them
  # would make every layer below it red. Deferring below the top is what lets a
  # stack land one reviewable layer at a time.
  #
  # The layer is told from its position in the stack, not from its own base
  # branch: GitHub reports base.ref as the stack's base for the bottom layer and
  # as the branch below for the others, while the stack's own position and size
  # are exact. Verified against this repository on 2026-09-16: the payload for a
  # two-layer stack carries stack.position 1 and 2 with stack.size 2. A pull
  # request outside a stack keeps the old rule, deferring whenever its base is
  # not main; a push to main always checks.
  FRESHNESS: ${{ github.event_name == 'pull_request' && ((github.event.pull_request.stack != null && github.event.pull_request.stack.position != github.event.pull_request.stack.size) || (github.event.pull_request.stack == null && github.event.pull_request.base.ref != 'main')) && 'deferred' || 'checked' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      # Before the suite rather than after it, because this is the failure mode
      # that makes a suite report the wrong thing: an abort called from an
      # httptest handler kills that goroutine alone, the client sees a transport
      # error, and the test fails somewhere else entirely.
      - name: No testing.T abort is made off the test goroutine
        run: make check-test-goroutines
      # A theme-named test file hides its tests from a reader looking beside the
      # module, and can hide them from CI too: a coverage_boost_test.go would
      # match a .gitignore coverage_* rule and sit untracked indefinitely.
      - name: Every test file is named after a module it tests
        run: make check-test-file-names
      # A case loop that asserts without opening a subtest reports the whole
      # table as one failure, stops at the first t.Fatal, and cannot be selected
      # with -run. A loop that walks dependent steps rather than independent
      # cases says so with a `// sequential:` marker.
      - name: Every case loop runs its cases under t.Run
        run: make check-test-subtests
      - name: Run tests with coverage
        run: |
          go test -count=1 -coverpkg=./internal/...,./cmd/... -coverprofile=coverage.out ./cmd/... ./internal/...
          go tool cover -func=coverage.out | grep '^total:'
          # The summary line is anchored: a plain "total" also matches any function
          # whose name contains it, which yields two values and turns the comparison
          # below into an awk syntax error that silently passes the gate.
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Total coverage (internal/, cmd/server, cmd/internal): ${COVERAGE}%"
          if [ -z "${COVERAGE}" ]; then
            echo "FAIL: no total coverage line in coverage.out"
            exit 1
          fi
          if ! awk "BEGIN {exit !(${COVERAGE} + 0 >= ${COVERAGE_MIN} + 0)}" 2>/dev/null; then
            echo "FAIL: coverage ${COVERAGE}% is below minimum ${COVERAGE_MIN}%"
            exit 1
          fi
          echo "PASS: coverage ${COVERAGE}% meets minimum ${COVERAGE_MIN}%"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 1

  sonarcloud:
    name: "SA: SonarCloud"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        continue-on-error: true
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The job now gates every version-bearing manifest, and keeps the narrower
  # name.
  #
  # It was once named for a required status check in the branch ruleset. It is
  # not any more: the ruleset requires `CI verdict` alone, and this job is
  # required by being in that job's `needs` list. So renaming it is safe as long
  # as `verdict` is renamed with it — which is the general rule for every job
  # here, and the reason the ruleset names one check instead of sixteen. See
  # docs/development/repository-settings.md.
  server-json:
    name: server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
      - name: Install jsonschema
        run: pip install --quiet jsonschema
      # Covers every manifest that carries the version, not just server.json:
      # lhm.plugin.json and .plugin/plugin.json used to drift unnoticed because
      # nothing in CI ever read them.
      - name: Every version-bearing manifest matches the VERSION file
        run: make check-manifests
      # The stamper writes what the registry serves, and it runs once per
      # release inside the job holding this repository's publishing identities.
      # Two of its rewrites fail in a shape that still reads correctly — an OCI
      # entry stamped with another entry's repository, and a digest-pinned
      # identifier stamped without a digest — so they are driven here, on a
      # fixture, rather than discovered on a tag.
      - name: The release stamper does what server.json's entries need
        run: make check-stamper
      # The published-package verifier gates the two jobs that advertise a
      # release, so it has to tell propagation lag from wrong bytes: the first
      # is waited out, the second is reported on sight. Both directions are
      # pinned offline here, because on a tag the wrong answer is unrecoverable
      # in one direction and invisible in the other. So is the NuGet half: the
      # served package with nuget.org's signature removed must be the attested
      # one, which holds only for the archive layout validate_nuget.py demands.
      - name: The published-package verifier waits out lag and never a mismatch
        run: make check-verify-published
      # server.json pins one Claude Desktop bundle per operating system by
      # hash, and the bundles are built once per release. What they must be is
      # checked here, offline, so a bundle that installs and never starts on
      # one platform fails a pull request instead of a tag: the manifest's
      # platforms and overrides and the per-OS manifests derived from it, the
      # Linux launcher that picks amd64 or arm64 by uname -m (under /bin/sh,
      # dash, busybox sh and bash --posix, whichever the runner has, plus
      # shellcheck), the packer's refusals over the release job's dist/, the
      # fetch that holds each bundle to its attestation, and the registry
      # check that each system is served by exactly one declared bundle.
      # The runner's busybox is busybox-static, whose own uname and chmod run
      # whatever PATH says, so under it the launcher cases that need a stub
      # assert the real machine's binary or are skipped with the reason.
      # shellcheck, jq, zip and unzip come from the runner image. Off CI a test
      # skips when one is missing; here, where GitHub sets CI, it fails instead.
      - name: The Claude Desktop bundles start on every platform they list
        run: make check-mcpb
      # The npm launcher is the process a client or a supervisor signals, and
      # under npx not even that: npm passes the signal only to the shell it runs
      # the launcher through. So the launcher is run here, with the runner's
      # node, against a stand-in server, and held to passing argv and stdout
      # through, mirroring the exit code or signal, passing SIGTERM, SIGINT and
      # SIGHUP on, telling the server to stop at most once, and stopping it when
      # npm's shell dies. One case runs the real server, built by the target,
      # to show a Ctrl+C through the launcher keeps its --drain-delay, hence Go.
      # A missing node fails here rather than skipping, since GitHub sets CI.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: The npm launcher stops the server it started
        run: make check-npm-launcher
      # pip installs a macosx_<major>_<minor> wheel on any macOS at or above
      # the tag, and dyld refuses a binary below the minimum it declares. The
      # floor is the Go toolchain's, so it is read back from a darwin build here
      # rather than discovered by a user whose pip installed a wheel that
      # cannot start. The builder and the validator each refuse a disagreement.
      - name: The macOS wheels are tagged for the macOS the binary needs
        run: make check-pypi
      # The tap formula is rendered once per release, in the job that holds the
      # tap's deploy key, and nothing else reads it before a user installs it.
      # A dry run against a local stand-in tap holds it to pinning each binary
      # and the third-party notices to the signed checksums.txt, and LICENSE to
      # the repository's own file. ruby and git come from the runner image.
      - name: The Homebrew formula installs the binary with its licence and notices
        run: make check-homebrew-tap
      # The pr-description job and the site audit judge text that is not in the
      # tree, a pull request description and an npm advisory report, so their
      # rules are driven here against fixtures, on every event: the description gate
      # over bodies that must fail and bodies that must pass, and the site
      # audit over pnpm's captured output for a finding and for an outage. The
      # image smoke test's build-information check rides along: the Docker job
      # runs only when the Dockerfile changes, and its refusals need no image.
      - name: The PR description gate, the site audit and the image smoke test refuse what they claim
        run: make check-ci-scripts
      - name: Validate server.json against the MCP Registry schema
        run: |
          set -euo pipefail
          SCHEMA_URL=$(jq -r '."$schema"' server.json)
          echo "Schema: $SCHEMA_URL"
          # SSRF guard: only the official MCP Registry schema host is allowed.
          ALLOWED_PREFIX="https://static.modelcontextprotocol.io/"
          case "$SCHEMA_URL" in
            "$ALLOWED_PREFIX"*) ;;
            *) echo "::error::Schema URL must start with $ALLOWED_PREFIX (got: $SCHEMA_URL)"; exit 1 ;;
          esac
          # The schema lives on a third-party host, so a blip there must not read
          # as "server.json is invalid": a bare 503 from static.modelcontextprotocol.io
          # already failed this job once. curl retries 5xx/429/timeouts by default
          # once --retry is given.
          curl -fsSL --proto '=https' --tlsv1.2 \
            --retry 5 --retry-delay 3 --retry-connrefused --max-time 60 \
            "$SCHEMA_URL" -o /tmp/mcp-schema.json
          python3 -c "import json,jsonschema; \
            schema=json.load(open('/tmp/mcp-schema.json')); \
            inst=json.load(open('server.json')); \
            jsonschema.validate(inst, schema); \
            print('server.json: VALID')"
      # What the schema above cannot see: that a package declared as "mcpb"
      # points at a raw ELF binary, that an image tag was never pushed or has
      # moved off its digest, or that an npm version is missing the mcpName the
      # registry reads ownership from. Six entries sat in the first of those for
      # twenty tags here, every one of them schema-valid.
      #
      # On pushes only: it downloads tens of MB and talks to three registries,
      # which is worth doing once per merge rather than on every push to every
      # pull request. The job it lives in is already a gate, so a failure here
      # fails the same check.
      - name: Every declared package is published and is what it claims
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make check-server-json-packages

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Build server and probe
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/probe
      - name: Verify e2e tests compile
        run: go test -tags e2e -c -o /dev/null ./test/e2e/

      # The live e2e suite cannot run here — it depends on third-party mirrors
      # whose outages would be reported as our regressions. This module depends
      # on nothing external: it builds the binary, drives it over a socket, and
      # skips its nginx cases when the runner has no Docker. So unlike the suite
      # above it is compiled *and* run.
      - name: HTTP transport end-to-end
        run: go test -tags httpe2e -count=1 -timeout 900s ./test/e2e/http/
      # The other transport, and the primary one. It builds the binary and
      # drives it over pipes, reaching nothing but the fixtures it starts
      # itself, so it runs here for the same reason the module above does.
      - name: stdio transport end-to-end
        run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/
      - name: Check Markdown tables are formatted
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/format_md_tables/ --check
      - name: Check generated llms files are current
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/gen_llms/ --check

      - name: Evaluator results pages are generated, not hand-edited
        if: env.FRESHNESS == 'checked'
        run: go run ./cmd/gen_eval_pages/ --check

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - run: make golangci-lint

  # An uncredentialed job on purpose: it audits the jobs that *are* credentialed,
  # and a gate that fails must not be able to leak what the jobs behind it hold.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Every action pinned, no run-time-resolved code where the credentials are
        run: make check-supply-chain

  godoc:
    name: godoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Audit godoc coverage (exported symbols, packages and tests)
        run: go run ./cmd/godoc_tool/ audit --include-tests --fail-on-findings
      # The root's `./...` stops at a nested module, so the one there is
      # audited from inside it.
      - name: Audit godoc coverage (cmd/audit_binary_vulns, its own module)
        run: make godoc-check-binary-vulns
      - name: Audit MCP tool surface quality
        run: make audit-surface-quality

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make govulncheck

  # What a user's scanner will say about the binaries this tree would release,
  # and whether they are still standalone, on every pull request: a dependency
  # bump that adds an advisory against a module the binaries link, or a build
  # flag that gives them an ELF interpreter, fails here rather than at a tag.
  #
  # The binaries are GoReleaser's own snapshot build of the six targets, the
  # same configuration the release uses, so the two checks read what a release
  # would publish. The govulncheck job above asks a different question (does
  # this module's code reach a vulnerable symbol) and stays as it is.
  #
  # contents: read and no secrets: it builds and reads, and a gate that fails
  # must not be able to leak anything.
  release-binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # The release's exact version, so what is checked here is what the
          # release job's GoReleaser would build.
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean
      - name: Every linux binary is ELF64 with no PT_INTERP, and both are there
        run: make elf-standalone
      - name: No binary carries an advisory the declarations do not accept
        run: make check-binary-vulns BINARIES='dist/libgen-mcp_*/libgen-mcp*'
      - name: The standalone check refuses a PIE build and accepts the release's
        run: make check-elf-standalone
      # cmd/audit_binary_vulns is a module of its own, which the root's
      # `go test ./...` and coverage profile do not reach, so its tests and its
      # coverage floor run here, beside the gate they hold.
      - name: The vulnerability gate's own tests, at the coverage floor
        run: make test-binary-vulns

  # The release workflow only invokes GoReleaser when a tag is pushed, so a
  # malformed .goreleaser.yml used to surface at the worst possible moment —
  # mid-release, after the tag exists. Validate the config on every PR instead.
  goreleaser-config:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: check

  # Every doc artifact that is generated from code. Each of these had a
  # `make check-*` target already, but nothing ran them, so the generated
  # regions were free to drift from their sources: the evaluator pages spent
  # several releases claiming 45 scenarios while the tables listed 61.
  generated-docs:
    name: Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Evaluator results pages match the scenario list and the run
        if: env.FRESHNESS == 'checked'
        run: make check-eval-pages
      - name: llms.txt and llms-full.txt match the registered tools
        if: env.FRESHNESS == 'checked'
        run: make check-llms
      # LobeHub reads the capability arrays straight out of lhm.plugin.json — its
      # crawler cannot introspect a Go binary — so a stale manifest publishes the
      # previous release's tool surface to the marketplace with no warning.
      - name: lhm.plugin.json matches the registered tools and prompts
        if: env.FRESHNESS == 'checked'
        run: make check-lhm-manifest
      # The reference tables on the docs site render their names, types and
      # required flags from this file. A stale copy publishes a parameter list
      # that no longer matches what the server accepts.
      - name: tool-schema.json matches the registered surface
        if: env.FRESHNESS == 'checked'
        run: make check-tool-schema
      - name: Markdown tables are normalized
        if: env.FRESHNESS == 'checked'
        run: make check-md-tables
      # The README's counts are read from the source — the registered tools and
      # prompts, config.KnownSources, config.KnownEnvNames, and a walk of the
      # tree — so a sentence that says four when the server registers five is a
      # failure rather than a stale line nobody notices.
      - name: The README's counts match the source
        if: env.FRESHNESS == 'checked'
        run: make check-stats
      # A page that names a variable nobody reads, a source nobody can select
      # or a tool nobody registered is worse than a page that says nothing: the
      # reader who sets it gets silence, and the silence looks like their own
      # mistake. Not FRESHNESS-gated, like the buttons below it: a page can be
      # edited in any layer of a stack.
      - name: The documentation names nothing the server does not have
        run: make check-doc-names
      # Not FRESHNESS-gated, unlike everything above it: those check that a
      # generated file was regenerated, which is the top layer of a stack's job.
      # This checks what a button actually registers, and a button can be edited
      # in any layer — deferring it would let the layer that changes one be the
      # only layer that does not look at it.
      - name: The install buttons agree within each command
        run: make check-install-buttons
      # A gateway that refuses "unsafe characters" matches a character class,
      # not a codepoint list, so the served surface is held to pure ASCII prose
      # plus a short list of rejected ASCII characters. It reads the surface a
      # client receives rather than the source, because a description here is
      # assembled from half a dozen strings and a schema's from struct tags.
      - name: Nothing served carries a character a gateway rejects
        run: make check-gateway-chars
      # Every tool result and every prompt message is Markdown built from
      # catalog metadata, so a value carrying a pipe ends the cell it is in and
      # one carrying a newline ends the row. This walks each renderer in the
      # order it writes and asks, for every runtime value, which construct it
      # lands in and whether an escaper stands in front of it. It is not
      # FRESHNESS-gated: a leak is introduced by editing a renderer, which is
      # the layer this checks.
      - name: No catalog text reaches a Markdown construct unescaped
        run: make check-md-escaping

  analyze-md:
    name: Analyze Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: npx --yes markdownlint-cli2 "**/*.md"
      - name: Check local documentation links
        run: make check-doc-links

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3018

  # Both published platforms are built here and, more to the point, started:
  # an image nothing has ever executed on the platform it advertises is not a
  # tested artefact. This job used to build the runner's native platform alone
  # and never run it, which is a shape that cannot see the class of defect the
  # smoke script's header describes — a cross-compiled binary asking for a
  # loader the runtime image does not ship execs fine on amd64 and not at all
  # on arm64.
  #
  # The matrix leg is cheap despite the emulation: Go cross-compiles from the
  # build platform, so only the runtime stage's `apk add` and the `--version`
  # run below go through QEMU. `needs: docker` in the verdict below waits on
  # the whole matrix and reads one result for it, so this stays a single gate.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check for Docker changes
        id: filter
        run: |
          # The image's builder runs cmd/gen_third_party_notices and the smoke
          # test reads LICENSE, so a change to either is a change to the image.
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} -- Dockerfile .dockerignore scripts/smoke-test-image.sh LICENSE cmd/gen_third_party_notices)
          if [ -n "$CHANGED" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "No Docker-related files changed — skipping build"
          fi
      # QEMU so the non-native variant can be executed here, not only built.
      - name: Set up QEMU
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          tags: libgen-mcp:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: Smoke test the image
        if: steps.filter.outputs.docker == 'true'
        run: bash scripts/smoke-test-image.sh ci "libgen-mcp:ci=${{ matrix.platform }}"

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
        env:
          # The lint job does not run pa11y, so skip puppeteer's Chromium download.
          # Playwright's browser is a separate install, handled below — Mermaid
          # needs it and puppeteer's copy would not satisfy that.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Advisories rated high or critical in anything the site installs. The
      # ones already judged live in site/pnpm-workspace.yaml under
      # auditConfig.ignoreGhsas, each with its reason. pnpm exits non-zero both
      # for a finding and for an npm advisory endpoint that did not answer, and
      # a red check that means "npm had an outage" teaches people to read a red
      # audit as noise, so the script tells the two apart by what pnpm printed:
      # an unanswered run is annotated and passes, a finding always fails.
      - name: Audit the site's dependencies (high and above)
        run: make audit-site-deps
      # rehype-mermaid renders each diagram to inline SVG during the build, which
      # needs a real browser. Same cache key as the Pages workflow, so the two
      # jobs share one download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
      - name: Install Chromium for Mermaid rendering
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: site
      - name: Build the site
        run: pnpm run build
        working-directory: site
      - name: Lint (astro check, i18n parity, eslint, prettier, html-validate, htmlhint)
        run: pnpm run lint
        working-directory: site

  # The unit suite on the platforms this project actually ships binaries for.
  # GoReleaser builds six: linux, darwin and windows by amd64 and arm64, and
  # cmd/server carries platform-constrained source (listen_unix.go against
  # listen_other.go) that only one of them was ever compiling here.
  #
  # It runs on every pull request rather than only on main and at release, which
  # is the more expensive of the two shapes and is the point: a platform failure
  # found after merge is a red main nobody asked for, and the person who can fix
  # it fastest is the one who is still holding the change.
  #
  # Linux is in the matrix as the control. Without it, a macOS-only failure
  # cannot be told apart from a command that would have failed anywhere.
  cross-platform:
    name: Unit suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS bills several times the Linux rate, so a hung test must not sit
    # there for the six-hour default.
    timeout-minutes: 25
    strategy:
      # Every platform reports. Stopping at the first failure hides whether the
      # other two share it, which is the first thing you want to know.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      # The whole suite, tooling under cmd/ included: those commands write the
      # committed artifacts, and a path they only spell correctly on Linux
      # produces a diff nobody can reproduce.
      - run: go test ./... -count=1
      # The stdio module belongs on all three platforms rather than on Linux
      # alone: what it drives is a process, two pipes and a termination signal,
      # and each of those is spelled differently on Windows — the home directory
      # the server resolves its cache through, the console event that stands in
      # for SIGTERM, the executable extension. None of that is exercised by the
      # unit suite above.
      - run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/

  # A cheap type-check of the same targets on a Linux runner, one job per
  # platform, beside the real matrix rather than instead of it.
  #
  # The matrix above is expensive enough that somebody may reasonably narrow it
  # later. This job means narrowing it can never silently take the compile of
  # cmd/server/listen_other.go with it, and it costs seconds.
  cross-compile:
    name: Type-check (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Build
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # vet type-checks the test files too, which go build does not, so a test
      # that only compiles on one platform is caught here rather than in the
      # matrix above.
      - name: Vet, tests included
        run: go vet ./... && go vet -tags httpe2e ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # The pull request title and body, judged before the merge because this
  # repository squash merges: they become the commit message on main, and
  # neither a later commit nor an edit to the pull request after the merge can
  # reach that commit. It refuses a command that makes GitHub skip workflows
  # (in the squash commit it turns off CI on main and the release of any tag put
  # on that commit), a summary block a review bot injected, and an assistant's
  # attribution.
  #
  # The text comes from the event payload through env and is never written
  # into a run line: a description is attacker-controlled, and an expression
  # expanded inside the script is a shell injection. The payload is the text as
  # of the event that started this run, which is why `edited` is among the
  # triggers above and why a newer run cancels this one.
  #
  # Pull request only: a push has no description. needs-verdict.sh allows
  # exactly that skip, pr-description:push, and no other.
  pr-description:
    name: PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: No skip command, injected block or assistant attribution in the title or body
        run: bash scripts/check-pr-description.sh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_SOURCE_LABEL: "the ${{ github.event.action }} event's payload"

  # One check for branch protection to require.
  #
  # Naming every job in the ruleset means a job added later is not a gate until
  # somebody remembers to add it there too, which is a protection that weakens
  # each time the pipeline grows. This job needs them all, so a new job becomes
  # required by being added to its needs list — one edit, in the file the job
  # was added to.
  #
  # always() is what makes it able to report at all: without it the job is
  # skipped the moment anything it needs fails, and a skipped check is not a
  # failing one as far as the ruleset is concerned.
  verdict:
    name: CI verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - test
      - sonarcloud
      - server-json
      - build
      - golangci-lint
      - godoc
      - supply-chain
      - govulncheck
      - release-binaries
      - goreleaser-config
      - generated-docs
      - analyze-md
      - hadolint
      - docker
      - docs-site
      - cross-platform
      - cross-compile
      - pr-description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every job that fed this one must have passed
        run: printf '%s' "$NEEDS" | .github/scripts/needs-verdict.sh "$GITHUB_EVENT_NAME"
        env:
          NEEDS: ${{ toJSON(needs) }}
