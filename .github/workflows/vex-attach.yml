# Attach the OpenVEX statement to an image a release already published
#
# Releases from the one that introduced .vex/ onward attach their statement in
# release.yml's sign-attest job. An image published before that carries none,
# and rebuilding it would move the digest server.json, the MCP Registry and
# every client configuration pin. An attestation changes only the referrers of
# the index and its platform manifests, never the index itself, so this adds the
# statement to the published bytes without touching them.
#
# It is run by hand, from main, and only ever does what was asked:
#
#   gh workflow run vex-attach.yml --ref main -f tag=v2.2.0                 # dry run
#   gh workflow run vex-attach.yml --ref main -f tag=v2.2.0 -f dry_run=false
#
# A dry run resolves and checks everything and writes the document, and attaches
# nothing. Nothing is uploaded to the GitHub release: releases are immutable
# once published, so an older release has no asset to add the document to, and
# .vex/libgen-mcp.openvex.json on main is the file to read instead.
#
# The jobs keep the shape release.yml keeps. The ones that compile and run code
# hold `contents: read` and no secret, and the signing identity is live only in
# `attest`, which runs no build of anything.

name: Attach OpenVEX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose published image gets the statement, e.g. v2.2.0"
        required: true
        type: string
      dry_run:
        description: "Resolve, check and write the document without attaching it"
        required: false
        default: true
        type: boolean

# Nothing by default, as in release.yml: every job states what it needs.
permissions: {}

# One attach per tag at a time. The referrers fallback tag on ghcr.io is
# maintained by read-modify-write, so two runs writing it at once could lose an
# entry.
concurrency:
  group: vex-attach-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/libgen-mcp
  DOCKERHUB_IMAGE: jmrplens/libgen-mcp
  # The same exact pins as release.yml, for the same reason: these binaries
  # run in the job that holds the signing identity. Move them together.
  COSIGN_VERSION: "v3.1.3"
  ORAS_VERSION: "1.3.4"

jobs:
  # Which bytes the statement is about, decided before anything else runs: the
  # index the tag resolves to on ghcr.io, which must be the one Docker Hub
  # serves and must carry the release workflow's own signature for this tag.
  # A tag that moved since the release, or an index nobody's release signed,
  # stops the run here.
  resolve:
    name: Resolve the released image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.digests.outputs.version }}
      index: ${{ steps.digests.outputs.index }}
      amd64: ${{ steps.digests.outputs.amd64 }}
      arm64: ${{ steps.digests.outputs.arm64 }}
    steps:
      # An attach asked for from any ref but main would skip `attest` and
      # `verify` and finish green having attached nothing, so it is refused
      # here, before anything runs. A dry run from a branch stays allowed.
      - name: An attach runs from main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::dry_run=false needs --ref main: the attest job runs only there"
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Resolve and check the index
        id: digests
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${TAG} is not a release tag such as v2.2.0"
            exit 1
          fi
          version="${TAG#v}"
          ghcr=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${version}" --format '{{json .Manifest}}')
          hub=$(docker buildx imagetools inspect "docker.io/${DOCKERHUB_IMAGE}:${version}" --format '{{json .Manifest}}')
          index=$(jq -r .digest <<< "$ghcr")
          if [ "$index" != "$(jq -r .digest <<< "$hub")" ]; then
            echo "::error::ghcr.io and Docker Hub serve different indexes for ${version}; the release pushes one index to both"
            exit 1
          fi
          cosign verify \
            --certificate-identity "https://github.com/jmrplens/libgen-mcp/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${REGISTRY}/${IMAGE_NAME}@${index}" > /dev/null
          {
            echo "version=${version}"
            echo "index=${index}"
          } >> "$GITHUB_OUTPUT"
          for arch in amd64 arm64; do
            digest=$(jq -r --arg a "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest][0] // ""' \
              <<< "$ghcr")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the index lists no linux/${arch} manifest"
              exit 1
            fi
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
          done
          echo "${TAG}: index ${index}, signed by release.yml at refs/tags/${TAG}"

  # The statement is only as good as the gate behind it, so the gate runs again
  # here, on the tagged tree's six release targets, with main's declarations
  # and today's database: the same command release.yml runs, with the same
  # verdict required. Then the document is written from those declarations,
  # pinned to the tag's version and index, after the committed copy is held to
  # them.
  gate:
    name: Gate and write the document
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          path: tagged
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # One command for both halves: `make vex-release` runs the whole gate on
      # the tagged tree (every not-linked claim remade against `go list -deps`
      # of each of its release targets) and writes nothing unless it passes.
      - name: Gate the tagged release, then write its OpenVEX document
        env:
          TAG_VERSION: ${{ needs.resolve.outputs.version }}
          INDEX_DIGEST: ${{ needs.resolve.outputs.index }}
        run: |
          set -euo pipefail
          make vex-release VEX_VERSION="${TAG_VERSION}" VEX_DIGEST="${INDEX_DIGEST}" \
            VEX_DIR="${GITHUB_WORKSPACE}/tagged" VEX_OUT="${RUNNER_TEMP}/libgen-mcp.openvex.json"
          statements=$(jq '.statements | length' "${RUNNER_TEMP}/libgen-mcp.openvex.json")
          if [ "${statements}" -lt 1 ]; then
            echo "::error::the declarations make no not-linked statement, so there is nothing to attach"
            exit 1
          fi
          cat "${RUNNER_TEMP}/libgen-mcp.openvex.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openvex
          path: ${{ runner.temp }}/libgen-mcp.openvex.json
          retention-days: 7
          if-no-files-found: error

  # The attestations, the same six release.yml's sign-attest writes, and the
  # ghcr.io referrers fallback tags repaired after them the same way. From main
  # only, so the signing identity is always this file as reviewed.
  attest:
    name: Attest OpenVEX
    needs: [resolve, gate]
    if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      INDEX_DIGEST: ${{ needs.resolve.outputs.index }}
      AMD64_DIGEST: ${{ needs.resolve.outputs.amd64 }}
      ARM64_DIGEST: ${{ needs.resolve.outputs.arm64 }}
    permissions:
      contents: read # checkout, for the repair script
      packages: write # the referrer writes push-to-registry makes on ghcr.io
      id-token: write # the attestation identity
      attestations: write # actions/attest itself
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openvex

      - name: Attest OpenVEX (ghcr.io, index)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.resolve.outputs.index }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      - name: Attest OpenVEX (ghcr.io, linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.resolve.outputs.amd64 }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      - name: Attest OpenVEX (ghcr.io, linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.resolve.outputs.arm64 }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      - name: Attest OpenVEX (Docker Hub, index)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.resolve.outputs.index }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      - name: Attest OpenVEX (Docker Hub, linux/amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.resolve.outputs.amd64 }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      - name: Attest OpenVEX (Docker Hub, linux/arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.resolve.outputs.arm64 }}
          predicate-type: https://openvex.dev/ns/v0.2.0
          predicate-path: libgen-mcp.openvex.json
          push-to-registry: true

      # Pinned and checked exactly as release.yml's sign-attest installs it.
      - name: Install oras
        env:
          ORAS_SHA256: "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          TARBALL="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${ORAS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "${TARBALL}" oras
          install -m 0755 oras /usr/local/bin/oras
          rm -f "${TARBALL}" oras
          oras version

      # As in release.yml: a failure warns, since every attestation above
      # stands whatever the fallback tag's entries say.
      - name: Make the ghcr.io referrers fallback tags say what they list
        env:
          GHCR_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -uo pipefail
          if ! bash .github/scripts/referrers-fallback-repair.sh "${GHCR_REPO}" "${INDEX_DIGEST}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"; then
            echo "::warning title=ghcr.io referrers fallback tags::not rewritten. Run by hand: bash .github/scripts/referrers-fallback-repair.sh ${GHCR_REPO} ${INDEX_DIGEST} ${AMD64_DIGEST} ${ARM64_DIGEST}"
          fi

  # The statement as a scanner meets it, read back from each registry's
  # referrers, verified against this workflow on main, and equal to the
  # document the gate job wrote. No credential: the images are public.
  verify:
    name: Verify the attached statement
    needs: [resolve, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openvex
          path: ${{ runner.temp }}/vex
      - name: Read the statement back from both registries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEX_DIGEST: ${{ needs.resolve.outputs.index }}
        run: |
          set -euo pipefail
          for repo in "${REGISTRY}/${IMAGE_NAME}" "docker.io/${DOCKERHUB_IMAGE}"; do
            bash .github/scripts/verify-vex-attestation.sh "${repo}@${INDEX_DIGEST}" \
              "${RUNNER_TEMP}/vex/libgen-mcp.openvex.json" vex-attach.yml "${GITHUB_REF}"
          done
