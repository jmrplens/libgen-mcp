# Release pipeline for libgen-mcp
#
# Triggers: tag push matching v*
# Pipeline: GoReleaser (binaries + checksums + changelog + cosign + SBOM)
#           and a signed multi-arch Docker image on ghcr.io.

name: Release

on:
  push:
    tags:
      - "v*"
  # A dispatch is always a rehearsal; there is no input that makes it publish.
  # The version rehearsed is the one the dispatched tree carries in VERSION; the
  # input exists to state it explicitly, and preflight holds the two to each
  # other the way it holds a pushed tag. The tag does not have to exist.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to rehearse as, e.g. v1.7.3. Empty reads it from VERSION on the dispatched ref; a value must match it. Nothing is published."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.27.0"
  # The switch every step reads. Its companion, RELEASE_TAG, is the version
  # whichever way the run started, so a step stamps, tags or compares against
  # one name; that one is a job-level variable fed from preflight's output
  # rather than a workflow-level one, because on a dispatch it comes from the
  # VERSION file, which no expression up here can read.
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/libgen-mcp
  DOCKERHUB_IMAGE: jmrplens/libgen-mcp

jobs:
  # The one check that runs before anything else spends a runner, and the answer
  # every later job releases — or rehearses — as.
  #
  # The docker job tagged ghcr.io from the VERSION file while everything else
  # used the git tag, and nothing compared them: a tag pushed without the bump
  # would have published an image at one version and a server.json pinning
  # another, each internally consistent. Five minutes here settles it before the
  # transport gate boots.
  #
  # It declares contents: read and takes no secrets, like the two gates below.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release tag and hold it to VERSION
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          if [ "$REHEARSAL" = "true" ]; then
            TAG="${INPUT_TAG:-v${FILE_V}}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_V="${TAG#v}"
          if [ "${FILE_V}" != "${TAG_V}" ]; then
            echo "::error::VERSION file says ${FILE_V} but the tag is v${TAG_V} — the docker job would tag ghcr.io:${FILE_V} while server.json pins ghcr.io/jmrplens/libgen-mcp:${TAG_V}"
            if [ "$REHEARSAL" = "true" ]; then
              echo "::error::a rehearsal is of the version this tree carries: leave the tag input empty, or set it to v${FILE_V}"
            fi
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release tag ${TAG}, VERSION ${FILE_V}, rehearsal=${REHEARSAL}"

  # The gate in front of everything a tag sets in motion.
  #
  # Nothing used to stand between a tag push and published binaries, a pushed
  # image and a registry entry. The live e2e suite cannot fill that slot — it
  # depends on third-party mirrors a release runner may not reach — but this
  # module depends on nothing external, so it can.
  #
  # It deliberately declares no permissions beyond the default read and takes no
  # secrets: a gate that fails must not be able to leak anything, and it needs
  # none of what the jobs behind it hold.
  transport-e2e:
    name: Transport end-to-end
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Both transports, in one job rather than two: they gate the same thing
      # and share a checkout and a toolchain, and a release that stops for one
      # stops for the other anyway.
      - run: go test -tags httpe2e -count=1 -timeout 900s ./test/e2e/http/
      - run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/

  # The race detector, in parallel with the transport gate above rather than
  # behind it: the two are independent, and a tag should not wait for one to
  # learn about the other. Called rather than copied, so this runs exactly what
  # a maintainer runs from the Race workflow's dispatch menu.
  #
  # Like transport-e2e it declares contents: read and takes no secrets. A gate that
  # fails must not be able to leak what the jobs behind it hold.
  race:
    name: Race detector
    needs: [preflight]
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  release:
    name: GoReleaser
    # `docker` is a dependency and not a sibling: server.json declares the two
    # images by digest, and a digest only exists once the index has been pushed.
    # Stamping before that would pin the previous release's image under the new
    # tag — which is the one failure a reader of the manifest cannot see, since
    # the tag in the identifier would look right.
    needs: [preflight, transport-e2e, race, docker]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          # A rehearsal builds everything and publishes nothing: --snapshot skips
          # the tag validation and the GitHub release (the binaries still carry
          # the rehearsed version, through snapshot.version_template in
          # .goreleaser.yml, so the npm validator downstream accepts them),
          # --skip=publish keeps every artifact local, and --skip=sign leaves the
          # signing identity unused on artifacts nobody will ship. The SBOMs are
          # still generated, so syft's scan is exercised.
          args: ${{ env.REHEARSAL == 'true' && 'release --clean --snapshot --skip=publish,sign,announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

      # Built in a rehearsal too — packing the bundle is the part that can
      # break, and it is the file server.json's hash is taken from — and
      # uploaded only when there is a release to attach it to.
      - name: Build the .mcpb Claude Desktop bundle
        run: bash scripts/build-mcpb.sh "${RELEASE_TAG#v}"

      - name: Upload the .mcpb bundle to the release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${RELEASE_TAG#v}" dist/libgen-mcp.mcpb --clobber

      # Every asset — binaries, checksums.txt and its signature, the SBOMs and
      # the .mcpb above — is attached before the release becomes visible, so no
      # installer or updater ever observes a partial one. GoReleaser creates it
      # as a draft (.goreleaser.yml: draft: true) and this is the flip.
      #
      # It is also why this step comes before the registry publish rather than
      # at the end: a draft release's assets are not publicly downloadable, and
      # the registry fetches the bundle server.json declares.
      - name: Publish the release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${RELEASE_TAG#v}" --draft=false

      # A rehearsal has no release for the Homebrew job to read checksums from,
      # and the formula's hashes are the part of it that can be wrong. Handing
      # that job this file is what lets the rendering run for real on a
      # dispatch; on a tag it downloads the published one and verifies its
      # signature instead.
      - name: Keep the rehearsal's checksums for the tap job
        if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-checksums
          path: dist/checksums.txt
          retention-days: 1

      # npm publish via OIDC trusted publisher — no stored token. dist/ already
      # holds the release binaries under their published names here, the same
      # spot the .mcpb step above reads from. The workflow's id-token: write
      # permission lets npm mint the OIDC token; npm >= 11.5.1 performs the
      # exchange, so setup-node's Node 22 is upgraded first. Provenance is
      # attached automatically under trusted publishing (no --provenance flag),
      # and publish-npm.sh skips any version already on the registry, so
      # re-running this job is safe.
      #
      # Bootstrap: a package cannot have a trusted publisher configured until it
      # exists, so the first release's seven packages are created by a one-time
      # tokened publish; from the next tag on, this runs with no credential. The
      # trusted publisher on npmjs.com must name this workflow file
      # (release.yml); this job declares no `environment:`, so that field stays
      # blank there.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Validate the assembled packages before anything is published. A
      # published npm version is permanent, so a broken tarball has to fail the
      # release here rather than after it is irreversibly on the registry. This
      # runs on the ephemeral runner, which is already disposable; the same
      # check runs in Docker via `make validate-npm` on a developer's machine.
      - name: Validate npm packages
        run: make validate-npm-local NPM_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      - name: Publish to npm
        if: env.REHEARSAL != 'true'
        run: |
          set -euo pipefail
          # Pinned, not @latest: this CLI runs `npm publish` under the job's
          # id-token: write, so a surprising or compromised `latest` could push
          # altered packages. 11.5.1 is the floor npm trusted publishing
          # requires; bump it deliberately.
          npm install -g npm@11.5.1
          # --no-assemble: publish the tree the step above validated, rather
          # than rebuilding it and shipping bytes nothing looked at.
          bash scripts/publish-npm.sh dist "${RELEASE_TAG#v}" --no-assemble

      # PyPI and NuGet follow npm here, and all three come before the registry
      # publish below: mcp-publisher validates ownership by fetching each
      # package server.json declares, so a package declared and not yet
      # published fails the whole release at that step.
      #
      # Both build from the same dist/ the npm step used, and both validate
      # before uploading, because a PyPI file name is burned forever even if
      # the release is deleted and a NuGet version can be unlisted but never
      # replaced.

      - name: Build and validate the PyPI wheels
        run: make validate-pypi-local PYPI_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      # Rehearsal only, and the counterpart of the NuGet login below: it
      # performs the same OIDC exchange the publish would, gets a short-lived
      # API token back and throws it away. Without this a rehearsal proves
      # nothing about PyPI — the upload is the only step that touches the
      # policy, and it is skipped — so a publisher named for the wrong workflow
      # file or with an environment set would surface for the first time at a
      # tag, after the release is already public.
      #
      # The minted token is masked before anything else can print it, and it is
      # never used: it expires on its own.
      - name: PyPI trusted publisher (mint a token, upload nothing)
        if: env.REHEARSAL == 'true'
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | jq -r '.value')
          if [ -z "${oidc}" ] || [ "${oidc}" = "null" ]; then
            echo "::error::no OIDC token was issued for audience 'pypi'"
            exit 1
          fi
          response=$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg t "${oidc}" '{token: $t}')")
          token=$(jq -r '.token // empty' <<<"${response}")
          if [ -z "${token}" ]; then
            echo "::error::pypi.org refused the OIDC exchange: $(jq -c '.message // .' <<<"${response}")"
            echo "::error::the trusted publisher must name owner jmrplens, repository libgen-mcp, workflow release.yml and a blank environment"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "pypi.org accepted this workflow's identity and issued a token; nothing was uploaded"

      # OIDC trusted publisher: no stored token, PEP 740 attestations attached
      # automatically, and skip-existing lets a re-run land on files already
      # uploaded without failing. The publisher on pypi.org names this
      # repository, this workflow file and a **blank** environment — this job
      # declares no `environment:`, exactly as the npm publisher requires, and
      # adding one would break both at once.
      - name: Publish to PyPI
        if: env.REHEARSAL != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: pypi/dist
          skip-existing: true

      # An exact SDK version rather than 10.0.x: dnx's behaviour is an SDK
      # property, and this is the same line the container `make validate-nuget`
      # pins by digest. Bump the two together.
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build and validate the NuGet packages
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: make validate-nuget-local NUGET_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      # nuget.org trusted publishing: the job's OIDC token is exchanged for an
      # API key that lives one hour. **This runs in a rehearsal too** — it mints
      # a credential and spends nothing, and a policy that has drifted is
      # exactly what a rehearsal should catch. The input is the nuget.org
      # profile name, which is public, so it is a literal rather than a secret.
      - name: NuGet login (OIDC to a temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jmrplens

      # --no-assemble pushes the tree the validation step opened, and the script
      # pushes the runtime packages before the pointer, so an install racing the
      # publish never resolves a pointer whose packages are not there yet.
      - name: Publish to NuGet
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          # Withheld from a rehearsal, not merely unused by it: the dry run
          # never reads the key, so the step has no reason to hold it.
          NUGET_API_KEY: ${{ env.REHEARSAL != 'true' && steps.nuget-login.outputs.NUGET_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = "true" ]; then
            bash scripts/publish-nuget.sh dist "${RELEASE_TAG#v}" --no-assemble --dry-run
          else
            bash scripts/publish-nuget.sh dist "${RELEASE_TAG#v}" --no-assemble
          fi

      # Runs in a rehearsal too, and that is the point: this is where the
      # stamper meets a real digest and a real bundle, and a rehearsal that
      # skipped it could not catch the one thing S39's refusals exist for.
      - name: Pin server.json version and SHA256 hashes
        env:
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}" \
            dist/libgen-mcp.mcpb "${OCI_DIGEST}"
          # Prove the pin landed before anything is published. mcp-publisher reads
          # server.json, so a pin that silently no-opped would publish the previous
          # version — and the duplicate-version guard below would then report that
          # as "already published" and let the release go green with the registry
          # never advancing. Fail here, where the cause is still obvious.
          PINNED=$(jq -r '.version' server.json)
          if [ "${PINNED}" != "${VERSION}" ]; then
            echo "::error::server.json says ${PINNED} but the tag is ${VERSION}; refusing to publish"
            exit 1
          fi
          STALE=$(jq -r --arg v "${VERSION}" \
            '[.packages[] | select((.version // $v) != $v)] | length' server.json)
          if [ "${STALE}" -ne 0 ]; then
            echo "::error::${STALE} of server.json's package entries are not at ${VERSION}"
            exit 1
          fi
          echo "server.json pinned to ${VERSION} (top level and all packages)"

      # Publishing to the public MCP Registry only makes sense once the repo and
      # its release assets are public. This step auto-skips while the repo is
      # private and activates automatically when it is made public.
      - name: Publish to MCP Registry
        if: ${{ env.REHEARSAL != 'true' && github.event.repository.private == false }}
        env:
          MCP_PUBLISHER_VERSION: "v1.7.8"
          MCP_PUBLISHER_SHA256: "48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c"
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          SIGSTORE_BUNDLE="${TARBALL}.sigstore.json"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${SIGSTORE_BUNDLE}" "${URL}.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${TARBALL}" | sha256sum -c -
          cosign verify-blob \
            --bundle "${SIGSTORE_BUNDLE}" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TARBALL}"
          tar xzf "${TARBALL}" mcp-publisher
          ./mcp-publisher login github-oidc
          VERSION="${RELEASE_TAG#v}"
          set +e
          ./mcp-publisher publish 2>&1 | tee mcp-publisher-publish.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            # A duplicate here can only be a duplicate of this tag: the pin step
            # above refuses to continue unless server.json carries ${VERSION}, so
            # there is no longer a path where a stale manifest re-offers an older
            # version and hides behind this branch. Matching the registry's error
            # text alone therefore keeps re-runs idempotent without reopening that
            # hole — the guard that closes it is the assertion, not this grep.
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              echo "::notice::MCP Registry already has ${VERSION}; this is a re-run, continuing"
            else
              exit "${STATUS}"
            fi
          elif ! grep -qF "version ${VERSION}" mcp-publisher-publish.log; then
            # A zero exit is not on its own proof that the intended version went out.
            echo "::error::mcp-publisher succeeded but did not report version ${VERSION}"
            cat mcp-publisher-publish.log
            exit 1
          fi
          echo "::notice::MCP Registry now serves ${VERSION} as the latest version"

      - name: Commit pinned server.json back to main
        if: ${{ env.REHEARSAL != 'true' && github.event.repository.private == false }}
        env:
          RELEASE_DEPLOY_KEY_B64: ${{ secrets.RELEASE_DEPLOY_KEY_B64 }}
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # main is protected by a ruleset. Push over SSH with a write-enabled
          # deploy key, which the ruleset's DeployKey bypass allows.
          if [ -z "${RELEASE_DEPLOY_KEY_B64:-}" ]; then
            echo "::warning::RELEASE_DEPLOY_KEY_B64 not set — skipping the server.json pin-back to main."
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          echo "${RELEASE_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}" 2>/dev/null

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          # dist/ is untracked, so the bundle the stamp above hashed survives
          # the checkout and the two runs agree on every field.
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}" \
            dist/libgen-mcp.mcpb "${OCI_DIGEST}"
          # Every manifest the script stamps, not just the two it stamped first;
          # `if` rather than `[ -f … ] &&`, whose non-zero status would abort the
          # step under `set -e` the day a manifest is renamed away.
          for manifest in server.json lhm.plugin.json mcpb/manifest.json .plugin/plugin.json plugin.json npm/libgen-mcp/package.json; do
            if [ -f "${manifest}" ]; then git add "${manifest}"; fi
          done
          if git diff --cached --quiet; then
            echo "::notice::No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: stamp v${VERSION} into the version-bearing manifests"
          git push origin main

  docker:
    name: Docker
    needs: [preflight, transport-e2e, race]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    # The digest of the image index, which the release job stamps into
    # server.json's two OCI identifiers. One value for both registries: the
    # multi-platform build is pushed once and ghcr.io and Docker Hub hold the
    # identical index.
    #
    # In a rehearsal it is the digest of the index exported to a tarball, read
    # back by the step below, so the stamping step downstream runs on a real
    # value rather than being skipped — which is the only way a rehearsal can
    # exercise the refusals that exist for exactly this field.
    outputs:
      digest: ${{ steps.rehearsal-digest.outputs.digest || steps.docker-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      # The registry logins run in a rehearsal too. They mint a credential and
      # spend nothing, and a policy that has drifted is exactly the kind of
      # failure a rehearsal is for; only the push below is skipped.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker Hub credentials
        id: dockerhub-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping Docker Hub publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dockerhub-login.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Nothing is published until both images have been started. `load: true`
      # takes one platform per build, which is why this is two steps rather
      # than the multi-platform build below; the push reuses their layers from
      # the gha cache, so the second build of each is a cache hit rather than a
      # second compile.
      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: libgen-mcp:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
      - name: Build linux/arm64 for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: libgen-mcp:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
      - name: Smoke test both architectures
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/smoke-test-image.sh "${EXPECTED_VERSION}" \
            libgen-mcp:smoke-amd64=linux/amd64 \
            libgen-mcp:smoke-arm64=linux/arm64
      # In a rehearsal the same multi-platform build, with the same provenance
      # and SBOM, is exported to an OCI layout on the runner instead of pushed:
      # the image index that would have gone to the registry exists, so its
      # digest is real and the stamping step pins it, and nothing has left the
      # machine.
      - uses: docker/build-push-action@v7
        id: docker-push
        with:
          context: .
          push: ${{ env.REHEARSAL != 'true' }}
          outputs: ${{ env.REHEARSAL == 'true' && format('type=oci,dest={0}/rehearsal-image.tar', runner.temp) || '' }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:{1}', env.DOCKERHUB_IMAGE, steps.version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
      # Rehearsal only: the action reports the exported index's digest the same
      # way it reports a pushed one, and the OCI layout's own index.json is read
      # if it does not, so the stamping step never runs on an empty value.
      - name: Read the rehearsed image's digest
        id: rehearsal-digest
        if: env.REHEARSAL == 'true'
        env:
          BUILT_DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${BUILT_DIGEST}"
          if [ -z "$digest" ]; then
            digest=$(tar -xOf "${RUNNER_TEMP}/rehearsal-image.tar" index.json | jq -r '.manifests[0].digest')
          fi
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the OCI export reported no digest (got '${digest}')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "rehearsed image index ${digest}, exported to a tarball and pushed nowhere"
      - name: Sign Docker image (ghcr.io)
        if: env.REHEARSAL != 'true'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-push.outputs.digest }}
      - name: Sign Docker image (docker.io)
        if: env.REHEARSAL != 'true' && steps.dockerhub-login.outputs.skip == 'false'
        run: |
          cosign sign --yes \
            docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.docker-push.outputs.digest }}
      # The Docker Hub repository descriptions are owned by this repo so they
      # cannot drift (they had been empty since the repository was published,
      # across thousands of pulls): the short description and the curated
      # description file are re-pushed on every release, right after the
      # image publish. The full README (~50KB) exceeds Docker Hub's 25,000
      # character limit, so .github/dockerhub-description.md carries the
      # Docker-relevant sections. DOCKERHUB_TOKEN must be a Docker Hub PAT
      # with read/write/delete scope — the descriptions API rejects narrower
      # ones.
      - name: Update Docker Hub description
        if: env.REHEARSAL != 'true' && steps.dockerhub-login.outputs.skip == 'false'
        # Pinned to a commit SHA (unlike the org-owned actions above) because
        # this is an individually-maintained action that receives
        # DOCKERHUB_TOKEN — a mutable tag would let a compromised release
        # exfiltrate it.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MCP server to search and read Library Genesis and open-access sources. By jmrp.io"
          readme-filepath: ./.github/dockerhub-description.md

  # Homebrew is the fastest path from a tag to a running binary on somebody's
  # machine, so it waits for the release job: a tap that advertises a version
  # whose packages failed to publish is worse than a tap one release behind.
  #
  # It holds the tap's deploy key and runs no third-party code, which is why it
  # is a job of its own rather than a step beside the publishes.
  homebrew:
    name: Homebrew tap
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2

      - name: Take the rehearsal's own checksums
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@v8
        with:
          name: rehearsal-checksums
          path: dist

      # The formula's sha256 lines are only as trustworthy as where they came
      # from, so on a real release the manifest is downloaded with its sigstore
      # bundle and verified before a single hash is read out of it.
      - name: Fetch and verify the release checksums
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${RELEASE_TAG#v}" --dir dist \
            --pattern 'checksums.txt' --pattern 'checksums.txt.sigstore.json' --clobber
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Update the tap formula
        env:
          # Withheld from a rehearsal, not merely unused by it: the tap is
          # cloned read-only over https and the commit is shown rather than
          # pushed, so the step has no reason to hold the key.
          TAP_DEPLOY_KEY_B64: ${{ env.REHEARSAL != 'true' && secrets.TAP_DEPLOY_KEY_B64 || '' }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ "$REHEARSAL" = "true" ]; then
            TAP_REPO=https://github.com/jmrplens/homebrew-tap.git \
              bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" \
                "${RUNNER_TEMP}/homebrew-tap" --dry-run
            exit 0
          fi
          # The tap repository and its deploy key are set up once, by hand. Until
          # then a release is not held up by a channel that does not exist yet.
          if [ -z "${TAP_DEPLOY_KEY_B64}" ]; then
            echo "::warning::TAP_DEPLOY_KEY_B64 is not configured — skipping the Homebrew tap update"
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/tap_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/tap_known_hosts"
          echo "${TAP_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" "${RUNNER_TEMP}/homebrew-tap"

  # winget opens a pull request against microsoft/winget-pkgs, so nothing here
  # can run dry and a rehearsal skips the job whole. `env` is not readable in a
  # job-level `if`, hence the event test.
  winget:
    name: Winget
    needs: [release]
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    permissions: {} # both steps authenticate with WINGET_TOKEN, not GITHUB_TOKEN
    steps:
      - name: Check the winget credentials
        id: winget-token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::WINGET_TOKEN is not configured — skipping the winget submission."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The fork MUST be synced before the releaser runs: komac creates its
      # branch on the fork, and a stale fork fails with "Ref cannot be created",
      # which the releaser's continue-on-error would then hide. This step is
      # deliberately blocking — nothing downstream depends on this job, so a red
      # winget job is the visibility a silently skipped submission lacks.
      - name: Sync the winget-pkgs fork with upstream
        if: steps.winget-token.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh api -X POST repos/jmrplens/winget-pkgs/merge-upstream -f branch=master

      # Only works once the initial manifest for jmrplens.libgen-mcp has been
      # accepted upstream, which is a one-time manual submission;
      # continue-on-error keeps releases green until then, and when Microsoft's
      # validation service hiccups.
      #
      # Pinned to a commit SHA because this is an individually-maintained action
      # that receives WINGET_TOKEN — a mutable tag would let a compromised
      # release exfiltrate it.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: steps.winget-token.outputs.skip == 'false'
        continue-on-error: true
        with:
          identifier: jmrplens.libgen-mcp
          installers-regex: '-windows-(amd64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
