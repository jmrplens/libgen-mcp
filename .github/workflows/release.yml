# Release pipeline for libgen-mcp
#
# Triggers: tag push matching v*
# Pipeline: GoReleaser (binaries + checksums + changelog + cosign + SBOM)
#           and a signed multi-arch Docker image on ghcr.io.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26.5"
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/libgen-mcp
  DOCKERHUB_IMAGE: jmrplens/libgen-mcp

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload the .mcpb Claude Desktop bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash scripts/build-mcpb.sh "${VERSION}"
          gh release upload "v${VERSION}" dist/libgen-mcp.mcpb --clobber

      - name: Pin server.json version and SHA256 hashes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}"
          # Prove the pin landed before anything is published. mcp-publisher reads
          # server.json, so a pin that silently no-opped would publish the previous
          # version — and the duplicate-version guard below would then report that
          # as "already published" and let the release go green with the registry
          # never advancing. Fail here, where the cause is still obvious.
          PINNED=$(jq -r '.version' server.json)
          if [ "${PINNED}" != "${VERSION}" ]; then
            echo "::error::server.json says ${PINNED} but the tag is ${VERSION}; refusing to publish"
            exit 1
          fi
          STALE=$(jq -r --arg v "${VERSION}" \
            '[.packages[] | select((.version // $v) != $v)] | length' server.json)
          if [ "${STALE}" -ne 0 ]; then
            echo "::error::${STALE} package entr(y|ies) in server.json are not at ${VERSION}"
            exit 1
          fi
          echo "server.json pinned to ${VERSION} (top level and all packages)"

      # Publishing to the public MCP Registry only makes sense once the repo and
      # its release assets are public. This step auto-skips while the repo is
      # private and activates automatically when it is made public.
      - name: Publish to MCP Registry
        if: ${{ github.event.repository.private == false }}
        env:
          MCP_PUBLISHER_VERSION: "v1.7.8"
          MCP_PUBLISHER_SHA256: "48230dbec85bd88a0d42977ef533cddda23235f0db4331b9263ce53b432cb75c"
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          SIGSTORE_BUNDLE="${TARBALL}.sigstore.json"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${TARBALL}" "${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-connrefused -o "${SIGSTORE_BUNDLE}" "${URL}.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${TARBALL}" | sha256sum -c -
          cosign verify-blob \
            --bundle "${SIGSTORE_BUNDLE}" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TARBALL}"
          tar xzf "${TARBALL}" mcp-publisher
          ./mcp-publisher login github-oidc
          VERSION="${GITHUB_REF#refs/tags/v}"
          set +e
          ./mcp-publisher publish 2>&1 | tee mcp-publisher-publish.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            # Only a duplicate of THIS tag is benign — that is a re-run of the same
            # release. A duplicate of any other version means server.json was not
            # carrying the tag, which is the one failure this guard must not hide.
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log &&
               grep -qF "${VERSION}" mcp-publisher-publish.log; then
              echo "::notice::MCP Registry already has ${VERSION}; this is a re-run, continuing"
            else
              exit "${STATUS}"
            fi
          elif ! grep -qF "version ${VERSION}" mcp-publisher-publish.log; then
            # A zero exit is not on its own proof that the intended version went out.
            echo "::error::mcp-publisher succeeded but did not report version ${VERSION}"
            cat mcp-publisher-publish.log
            exit 1
          fi
          echo "::notice::MCP Registry now serves ${VERSION} as the latest version"

      - name: Commit pinned server.json back to main
        if: ${{ github.event.repository.private == false }}
        env:
          RELEASE_DEPLOY_KEY_B64: ${{ secrets.RELEASE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"

          # main is protected by a ruleset. Push over SSH with a write-enabled
          # deploy key, which the ruleset's DeployKey bypass allows.
          if [ -z "${RELEASE_DEPLOY_KEY_B64:-}" ]; then
            echo "::warning::RELEASE_DEPLOY_KEY_B64 not set — skipping the server.json pin-back to main."
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          echo "${RELEASE_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}" 2>/dev/null

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}"
          git add server.json
          [ -f lhm.plugin.json ] && git add lhm.plugin.json
          if git diff --cached --quiet; then
            echo "::notice::No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: pin server.json + stamp lhm.plugin.json for v${VERSION}"
          git push origin main

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker Hub credentials
        id: dockerhub-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping Docker Hub publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dockerhub-login.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: docker-push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:{1}', env.DOCKERHUB_IMAGE, steps.version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
      - name: Sign Docker image (ghcr.io)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-push.outputs.digest }}
      - name: Sign Docker image (docker.io)
        if: steps.dockerhub-login.outputs.skip == 'false'
        run: |
          cosign sign --yes \
            docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ steps.docker-push.outputs.digest }}

  # Deploy the tagged release to the public Fly.io instance
  # (https://libgen-mcp.fly.dev/). Skips silently when FLY_API_TOKEN is not
  # configured, so a fork or a token-less setup never fails the release.
  fly-deploy:
    name: Fly.io Deploy
    runs-on: ubuntu-latest
    # Records the deployment under the release environment, so Fly.io rollouts
    # appear in the repository's deployment history and can be gated behind a
    # protection rule without touching this file.
    environment:
      name: release
      url: https://libgen-mcp.fly.dev/
    needs: [release, docker]
    if: ${{ github.repository == 'jmrplens/libgen-mcp' }}
    steps:
      - uses: actions/checkout@v7

      # This job already restricts itself to the canonical repository, so a missing
      # token is not a fork politely declining to deploy — it is a release that
      # cannot deploy, and it has to be loud. The previous version warned and set
      # skip=true, which made every later step no-op and the job report success:
      # v1.2.0 and v1.3.0 both "deployed" green while Fly.io went on serving an
      # older build that had been pushed by hand.
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is unset or empty. The secret may exist with an empty value — re-set it with a real Fly.io deploy token (fly tokens create deploy)."
            exit 1
          fi
          echo "FLY_API_TOKEN is present."

      - name: Extract version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly deploy --remote-only \
            --config fly.toml \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg COMMIT=${{ github.sha }} \
            --image-label v${{ steps.version.outputs.version }} \
            --ha=false \
            --strategy immediate

      - name: Report machine status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: fly status --config fly.toml

      # `fly status` prints the machine state but exits 0 even when the app is
      # unhealthy, so on its own it verifies nothing. Poll the deployed server's
      # own readiness endpoint instead, and fail the release when it never
      # answers. The app runs scale-to-zero (min_machines_running = 0), so the
      # first request has to wake a cold machine: hence the retries rather than a
      # single call.
      #
      # A 200 from /health is necessary but not sufficient: it only proves that
      # SOME machine is up. A deploy that silently did not take effect leaves the
      # previous build answering "ok" exactly like a good one — which is how
      # Fly.io kept serving 1.2.0 through two green releases. So the version the
      # server reports over MCP is asserted against the tag being released.
      - name: Verify the deployed server answers with this version
        env:
          BASE_URL: https://libgen-mcp.fly.dev
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          code=""
          for attempt in $(seq 1 10); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 "${BASE_URL}/health" || true)
            if [ "$code" = "200" ]; then
              echo "health check passed on attempt ${attempt}"
              break
            fi
            echo "attempt ${attempt}: ${BASE_URL}/health returned '${code:-no response}'"
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::${BASE_URL}/health never returned 200 — the release is deployed but not serving."
            exit 1
          fi

          raw=$(curl -fsS --max-time 30 -X POST "${BASE_URL}/" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-verify","version":"1"}}}')
          # The streamable-HTTP transport answers as SSE ("data: {...}"); fall back
          # to the raw body in case it ever replies with plain JSON instead.
          payload=$(printf '%s\n' "$raw" | sed -n 's/^data: //p' | head -n1)
          [ -n "$payload" ] || payload="$raw"
          served=$(printf '%s' "$payload" | jq -r '.result.serverInfo.version // empty')

          echo "serving='${served:-unknown}' expected='${EXPECTED}'"
          if [ "$served" != "$EXPECTED" ]; then
            echo "::error::Fly.io is serving '${served:-unknown}' but this release is '${EXPECTED}' — the deploy did not take effect."
            exit 1
          fi
          echo "Fly.io is serving ${served}."
