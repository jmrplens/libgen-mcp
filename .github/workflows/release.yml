# Release pipeline for libgen-mcp
#
# Triggers: tag push matching v*
# Pipeline: GoReleaser (binaries + checksums + changelog + cosign + SBOM)
#           and a signed multi-arch Docker image on ghcr.io.

name: Release

on:
  push:
    tags:
      - "v*"
  # A dispatch is always a rehearsal; there is no input that makes it publish.
  # The version rehearsed is the one the dispatched tree carries in VERSION; the
  # input exists to state it explicitly, and preflight holds the two to each
  # other the way it holds a pushed tag. The tag does not have to exist.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to rehearse as, e.g. v1.7.3. Empty reads it from VERSION on the dispatched ref; a value must match it. Nothing is published."
        required: false
        default: ""
        type: string

# Nothing by default. Every job states the tokens it needs and no job inherits
# one it does not: the build jobs hold `packages: write` and no signing
# identity, and the signing identity lives in a job that runs no third-party
# build action. A workflow-level grant would hand all three to every job,
# including the ones whose whole purpose is to run somebody else's code.
permissions: {}

env:
  GO_VERSION: "1.27.0"
  # The switch every step reads. Its companion, RELEASE_TAG, is the version
  # whichever way the run started, so a step stamps, tags or compares against
  # one name; that one is a job-level variable fed from preflight's output
  # rather than a workflow-level one, because on a dispatch it comes from the
  # VERSION file, which no expression up here can read.
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: jmrplens/libgen-mcp
  DOCKERHUB_IMAGE: jmrplens/libgen-mcp
  # Pinned exactly, not by range: both actions download these binaries at run
  # time into jobs that hold the signing and publishing identities, so pinning
  # the action by SHA leaves the code that actually runs unpinned.
  #
  # The cosign major is not a detail either: it decides how a signature is
  # attached, and a 2.x client reports "no signatures found" on an image a 3.x
  # client verifies. Bump it deliberately, and with the verification recipe in
  # the docs.
  GORELEASER_VERSION: "v2.18.2"
  COSIGN_VERSION: "v3.1.3"
  # syft and oras are fetched by hand in the jobs that hold a signing identity,
  # so they are pinned here and their SHA256 beside each install. Dependabot
  # does not see a curl, so these move when somebody moves them — deliberately
  # a release old rather than the newest, which is the same window the
  # `cooldown: 3` on every Dependabot ecosystem buys.
  SYFT_VERSION: "v1.51.1"
  ORAS_VERSION: "1.3.4"

jobs:
  # The one check that runs before anything else spends a runner, and the answer
  # every later job releases — or rehearses — as.
  #
  # The docker job tagged ghcr.io from the VERSION file while everything else
  # used the git tag, and nothing compared them: a tag pushed without the bump
  # would have published an image at one version and a server.json pinning
  # another, each internally consistent. Five minutes here settles it before the
  # transport gate boots.
  #
  # It declares contents: read and takes no secrets, like the two gates below.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the release tag and hold it to VERSION
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          FILE_V="$(tr -d '[:space:]' < VERSION)"
          if [ "$REHEARSAL" = "true" ]; then
            TAG="${INPUT_TAG:-v${FILE_V}}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG_V="${TAG#v}"
          if [ "${FILE_V}" != "${TAG_V}" ]; then
            echo "::error::VERSION file says ${FILE_V} but the tag is v${TAG_V} — the docker job would tag ghcr.io:${FILE_V} while server.json pins ghcr.io/jmrplens/libgen-mcp:${TAG_V}"
            if [ "$REHEARSAL" = "true" ]; then
              echo "::error::a rehearsal is of the version this tree carries: leave the tag input empty, or set it to v${FILE_V}"
            fi
            exit 1
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release tag ${TAG}, VERSION ${FILE_V}, rehearsal=${REHEARSAL}"

  # The gate in front of everything a tag sets in motion.
  #
  # Nothing used to stand between a tag push and published binaries, a pushed
  # image and a registry entry. The live e2e suite cannot fill that slot — it
  # depends on third-party mirrors a release runner may not reach — but this
  # module depends on nothing external, so it can.
  #
  # It deliberately declares no permissions beyond the default read and takes no
  # secrets: a gate that fails must not be able to leak anything, and it needs
  # none of what the jobs behind it hold.
  transport-e2e:
    name: Transport end-to-end
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Both transports, in one job rather than two: they gate the same thing
      # and share a checkout and a toolchain, and a release that stops for one
      # stops for the other anyway.
      - run: go test -tags httpe2e -count=1 -timeout 900s ./test/e2e/http/
      - run: go test -tags stdioe2e -count=1 -timeout 900s ./test/e2e/stdio/

  # The race detector, in parallel with the transport gate above rather than
  # behind it: the two are independent, and a tag should not wait for one to
  # learn about the other. Called rather than copied, so this runs exactly what
  # a maintainer runs from the Race workflow's dispatch menu.
  #
  # Like transport-e2e it declares contents: read and takes no secrets. A gate that
  # fails must not be able to leak what the jobs behind it hold.
  race:
    name: Race detector
    needs: [preflight]
    uses: ./.github/workflows/race.yml
    permissions:
      contents: read

  release:
    name: GoReleaser
    # `docker` is a dependency and not a sibling: server.json declares the two
    # images by digest, and a digest only exists once the index has been pushed.
    # Stamping before that would pin the previous release's image under the new
    # tag — which is the one failure a reader of the manifest cannot see, since
    # the tag in the identifier would look right.
    #
    # `sign-attest` is named here so a failed signature stops every publisher.
    # That used to come for free while signing lived inside the docker job;
    # once it moved out, nothing held it and an image nobody signed could have
    # shipped beside npm, PyPI and NuGet versions that cannot be withdrawn.
    needs: [preflight, transport-e2e, race, docker, sign-attest]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: write # create the release, upload the .mcpb, un-draft it
      id-token: write # cosign's blob signature, and the npm/PyPI/NuGet OIDC exchanges
      attestations: write # actions/attest-build-provenance over the assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Fetched by hand rather than through anchore/sbom-action/download-syft.
      # That action is pinned by SHA, but on Linux it downloads
      # raw.githubusercontent.com/anchore/syft/main/install.sh and runs it with
      # sh — so the code that executed here came from a branch head. This job
      # mints the release's cosign signature and holds the identity npm, PyPI,
      # NuGet and the attestation store trust, which is precisely where nothing
      # may be resolved at run time. Pinning the action pinned nothing about
      # the thing it fetched, the same trap GORELEASER_VERSION exists for.
      #
      # The bytes are pinned by SHA256, and cosign additionally proves they came
      # from anchore's own release workflow. That certificate identity ends in
      # refs/heads/main because syft releases from main rather than from a tag,
      # and the certificate asset is base64-wrapped.
      - name: Install syft
        env:
          SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
        run: |
          set -euo pipefail
          # In the runner's temp directory, not the checkout: GoReleaser
          # refuses a dirty tree on a tag, and the tarball and its four
          # signature files would be exactly that if a step here failed
          # between the download and the cleanup.
          cd "${RUNNER_TEMP}"
          TARBALL="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${SYFT_SHA256}  ${TARBALL}" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.txt "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.pem "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.pem"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.sig "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.sig"
          base64 -d syft-checksums.pem > syft-checksums.decoded.pem
          cosign verify-blob \
            --certificate syft-checksums.decoded.pem \
            --signature syft-checksums.sig \
            --certificate-identity "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            syft-checksums.txt
          # Strict, unlike oras's cross-check below: this file is the one cosign
          # signed, so fetching it is how the provenance claim is made at all,
          # not a second opinion about a pin that already matched.
          grep " ${TARBALL}\$" syft-checksums.txt | sha256sum -c -
          tar xzf "${TARBALL}" syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f "${TARBALL}" syft-checksums.txt syft-checksums.pem syft-checksums.decoded.pem syft-checksums.sig syft
          syft --version
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Exact, not `latest` and not `~> v2`: this binary is downloaded at
          # run time into the job that mints this release's signature and holds
          # every publishing identity, so SHA-pinning the action that fetches it
          # pins nothing about the thing fetched. Never past v2 — the config is
          # a `version: 2` config.
          version: ${{ env.GORELEASER_VERSION }}
          # A rehearsal builds everything and publishes nothing: --snapshot skips
          # the tag validation and the GitHub release (the binaries still carry
          # the rehearsed version, through snapshot.version_template in
          # .goreleaser.yml, so the npm validator downstream accepts them),
          # --skip=publish keeps every artifact local, and --skip=sign leaves the
          # signing identity unused on artifacts nobody will ship. The SBOMs are
          # still generated, so syft's scan is exercised.
          args: ${{ env.REHEARSAL == 'true' && 'release --clean --snapshot --skip=publish,sign,announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

      # GoReleaser leaves every binary in a per-target subdirectory — the first
      # rehearsal proved it: dist/artifacts.json names
      # `libgen-mcp-linux-amd64` with a path of
      # `dist/libgen-mcp_linux_amd64_v1/libgen-mcp`. The release-asset name
      # exists only in that manifest, so `dist/` has no file under it and every
      # step below that takes a directory of assets — the npm, PyPI and NuGet
      # builders, and their validators — finds nothing.
      #
      # It went unnoticed because each of those channels landed after the last
      # tag, so none of them had ever run. `build-mcpb.sh` is the exception and
      # the reason the gap stayed hidden: it looks its two binaries up with
      # `find` on the target path rather than by asset name.
      - name: Stage release-named binaries at the dist root
        run: |
          set -euo pipefail
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("libgen-mcp-"))) | [.name, .path] | @tsv' dist/artifacts.json \
            | while IFS=$'\t' read -r name path; do
                cp "$path" "dist/$name"
              done
          ls -1 dist/

      # Built in a rehearsal too — packing the bundle is the part that can
      # break, and it is the file server.json's hash is taken from — and
      # uploaded only when there is a release to attach it to.
      - name: Build the .mcpb Claude Desktop bundle
        run: bash scripts/build-mcpb.sh "${RELEASE_TAG#v}"

      - name: Upload the .mcpb bundle to the release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${RELEASE_TAG#v}" dist/libgen-mcp.mcpb --clobber

      # SLSA build provenance for every asset this release ships, stored in
      # GitHub's attestation store — no release asset changes and nothing is
      # re-uploaded. The cosign signature over checksums.txt answers "did our
      # release job mint this manifest"; provenance answers the other question,
      # which commit and which workflow run produced these bytes, and until now
      # nothing here answered it at all.
      #
      # `subject-checksums` keys the claim to the exact asset names in
      # checksums.txt, so the binaries and the seven SBOMs are covered in one
      # step and a name that is not in that file cannot be smuggled in. The
      # .mcpb needs its own step: it is built after GoReleaser, so appending it
      # to checksums.txt would invalidate the signature over that file — the
      # same reason the stamper hashes the bundle itself rather than reading it
      # from there.
      #
      # Verify: gh attestation verify <file> -R jmrplens/libgen-mcp
      - name: Attest build provenance (release assets)
        if: env.REHEARSAL != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Attest build provenance (Claude Desktop extension)
        if: env.REHEARSAL != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/libgen-mcp.mcpb

      # Every asset — binaries, checksums.txt and its signature, the SBOMs and
      # the .mcpb above — is attached before the release becomes visible, so no
      # installer or updater ever observes a partial one. GoReleaser creates it
      # as a draft (.goreleaser.yml: draft: true) and this is the flip.
      #
      # It is also why this step comes before the registry publish rather than
      # at the end: a draft release's assets are not publicly downloadable, and
      # the registry fetches the bundle server.json declares.
      - name: Publish the release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${RELEASE_TAG#v}" --draft=false

      # A rehearsal hands its build to every job downstream the way a release
      # hands them the published assets: the staged binaries, checksums.txt and
      # the bundle, which fetch-release-assets.sh unpacks and checks in place of
      # downloading. One tar rather than the files, so the executable bits
      # survive the trip.
      #
      # Without it those jobs would have nothing to run on at all: they produce
      # no artifacts of their own by design, and a dispatch publishes no release
      # for them to fetch.
      - name: Hand the rehearsal's build to the jobs downstream
        if: env.REHEARSAL == 'true'
        run: |
          set -euo pipefail
          (cd dist && tar -cf "${RUNNER_TEMP}/rehearsal-assets.tar" checksums.txt libgen-mcp.mcpb libgen-mcp-*)
          tar -tf "${RUNNER_TEMP}/rehearsal-assets.tar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: env.REHEARSAL == 'true'
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal-assets.tar
          retention-days: 1
          if-no-files-found: error

  # The three package registries publish from jobs of their own, each one
  # fetching the release's own assets rather than reading the build directory
  # the GoReleaser job happened to leave behind. What gets packed is then the
  # same bytes that were published, by construction, and a job that holds a
  # publishing identity no longer also holds GoReleaser's output and the deploy
  # key for main.
  #
  # None of them declares an `environment:`, and that is load-bearing rather
  # than an omission: npm, PyPI and NuGet each match a trusted publisher on the
  # repository, the workflow file **and** the environment, and all three
  # publishers here name a blank one. Adding an environment breaks all three at
  # once, during a real release, on the one path that never runs before a tag.
  npm:
    name: Publish to npm
    needs: [preflight, release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets
      id-token: write # npm's OIDC trusted-publisher exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh "${RELEASE_TAG#v}" dist

      # npm publish via OIDC trusted publisher — no stored token. dist/ holds
      # the release binaries under their published names, fetched and checked
      # against the signed checksums.txt above. This job's id-token: write
      # permission lets npm mint the OIDC token; npm >= 11.5.1 performs the
      # exchange, so setup-node's Node 22 is upgraded first. Provenance is
      # attached automatically under trusted publishing (no --provenance flag),
      # and publish-npm.sh skips any version already on the registry, so
      # re-running this job is safe.
      #
      # Bootstrap: a package cannot have a trusted publisher configured until it
      # exists, so the first release's seven packages are created by a one-time
      # tokened publish; from the next tag on, this runs with no credential. The
      # trusted publisher on npmjs.com must name this workflow file
      # (release.yml); this job declares no `environment:`, so that field stays
      # blank there.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Validate the assembled packages before anything is published. A
      # published npm version is permanent, so a broken tarball has to fail the
      # release here rather than after it is irreversibly on the registry. This
      # runs on the ephemeral runner, which is already disposable; the same
      # check runs in Docker via `make validate-npm` on a developer's machine.
      - name: Validate npm packages
        run: make validate-npm-local NPM_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      - name: Publish to npm
        if: env.REHEARSAL != 'true'
        run: |
          set -euo pipefail
          # Pinned, not @latest: this CLI runs `npm publish` under the job's
          # id-token: write, so a surprising or compromised `latest` could push
          # altered packages. 11.5.1 is the floor npm trusted publishing
          # requires; bump it deliberately.
          npm install -g npm@11.5.1
          # --no-assemble: publish the tree the step above validated, rather
          # than rebuilding it and shipping bytes nothing looked at.
          bash scripts/publish-npm.sh dist "${RELEASE_TAG#v}" --no-assemble

  # PyPI runs beside npm rather than after it — they share no state now that
  # each fetches the release for itself — and all three come before the registry
  # publish, which is an explicit `needs:` edge on the mcp-registry job:
  # mcp-publisher validates ownership by fetching each package server.json
  # declares, so a package declared and not yet published fails the release
  # there.
  #
  # It validates before uploading because a PyPI file name is burned forever,
  # even if the release is deleted.
  pypi:
    name: Publish to PyPI
    needs: [preflight, release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets
      id-token: write # PyPI's OIDC trusted-publisher exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh "${RELEASE_TAG#v}" dist

      - name: Build and validate the PyPI wheels
        run: make validate-pypi-local PYPI_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      # Rehearsal only, and the counterpart of the NuGet login below: it
      # performs the same OIDC exchange the publish would, gets a short-lived
      # API token back and throws it away. Without this a rehearsal proves
      # nothing about PyPI — the upload is the only step that touches the
      # policy, and it is skipped — so a publisher named for the wrong workflow
      # file or with an environment set would surface for the first time at a
      # tag, after the release is already public.
      #
      # The minted token is masked before anything else can print it, and it is
      # never used: it expires on its own.
      - name: PyPI trusted publisher (mint a token, upload nothing)
        if: env.REHEARSAL == 'true'
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | jq -r '.value')
          if [ -z "${oidc}" ] || [ "${oidc}" = "null" ]; then
            echo "::error::no OIDC token was issued for audience 'pypi'"
            exit 1
          fi
          response=$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg t "${oidc}" '{token: $t}')")
          token=$(jq -r '.token // empty' <<<"${response}")
          if [ -z "${token}" ]; then
            echo "::error::pypi.org refused the OIDC exchange: $(jq -c '.message // .' <<<"${response}")"
            echo "::error::the trusted publisher must name owner jmrplens, repository libgen-mcp, workflow release.yml and a blank environment"
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "pypi.org accepted this workflow's identity and issued a token; nothing was uploaded"

      # OIDC trusted publisher: no stored token, PEP 740 attestations attached
      # automatically, and skip-existing lets a re-run land on files already
      # uploaded without failing. The publisher on pypi.org names this
      # repository, this workflow file and a **blank** environment — this job
      # declares no `environment:`, exactly as the npm publisher requires, and
      # adding one would break both at once.
      - name: Publish to PyPI
        if: env.REHEARSAL != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi/dist
          skip-existing: true

  # NuGet, like the other two, fetches the release for itself. It validates
  # before pushing because a NuGet version can be unlisted but never replaced.
  nuget:
    name: Publish to NuGet
    needs: [preflight, release]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets
      id-token: write # NuGet/login's OIDC exchange for a temporary API key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh "${RELEASE_TAG#v}" dist

      # An exact SDK version rather than 10.0.x: dnx's behaviour is an SDK
      # property, and this is the same line the container `make validate-nuget`
      # pins by digest. Bump the two together.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"

      - name: Build and validate the NuGet packages
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: make validate-nuget-local NUGET_BINARIES=dist VERSION="${RELEASE_TAG#v}"

      # nuget.org trusted publishing: the job's OIDC token is exchanged for an
      # API key that lives one hour. **This runs in a rehearsal too** — it mints
      # a credential and spends nothing, and a policy that has drifted is
      # exactly what a rehearsal should catch. The input is the nuget.org
      # profile name, which is public, so it is a literal rather than a secret.
      - name: NuGet login (OIDC to a temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jmrplens

      # --no-assemble pushes the tree the validation step opened, and the script
      # pushes the runtime packages before the pointer, so an install racing the
      # publish never resolves a pointer whose packages are not there yet.
      - name: Publish to NuGet
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          # Withheld from a rehearsal, not merely unused by it: the dry run
          # never reads the key, so the step has no reason to hold it.
          NUGET_API_KEY: ${{ env.REHEARSAL != 'true' && steps.nuget-login.outputs.NUGET_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "$REHEARSAL" = "true" ]; then
            bash scripts/publish-nuget.sh dist "${RELEASE_TAG#v}" --no-assemble --dry-run
          else
            bash scripts/publish-nuget.sh dist "${RELEASE_TAG#v}" --no-assemble
          fi

  # Read the three registries back and compare what they serve with the
  # release's own signed checksums.
  #
  # It exists because the publishers **re-assemble** their packages after
  # validating them, so the bytes that were validated are not necessarily the
  # bytes that went out — and of the six per-platform binaries, only the
  # runner's own is ever executed by any check. A stale or swapped binary for
  # the other five reaches three registries that cannot be corrected, with
  # nothing in the pipeline looking at it again.
  #
  # This is the only step that inspects the bytes a user installs, and it runs
  # in a job holding no publishing credential of any kind. The retry budget is
  # the same allowance the registry publish gives itself and for the same
  # reason — this runs minutes after the uploads, and a registry CDN that has
  # not caught up answers 404 — and it is spent only on downloads: a digest
  # that does not match fails on sight, with no second attempt.
  verify-published:
    name: Verify published packages
    needs: [preflight, npm, pypi, nuget]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      - name: Fetch and verify the signed checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh --checksums-only "${RELEASE_TAG#v}" dist

      - name: Compare registry packages with the signed checksums
        if: env.REHEARSAL != 'true'
        run: |
          python3 scripts/verify_published_packages.py \
            --retry-budget 480 --retry-delay 30 \
            "${RELEASE_TAG#v}" dist/checksums.txt

      - name: Nothing to verify in a rehearsal
        if: env.REHEARSAL == 'true'
        run: |
          echo "::notice::rehearsal: nothing was published, so there is nothing on npm, PyPI or NuGet to compare with the checksums; the comparison runs on the next real release"

  # The MCP Registry publish, last of the publishers and behind every one of
  # them as an explicit `needs:` edge. The registry validates the npm entry by
  # reading mcpName off the published package, the PyPI one by GETting
  # pypi.org's JSON for this version, the NuGet one by reading that version's
  # README off the v3 feed, and the two OCI entries by resolving the image tag
  # — so racing any of those uploads spends the retry budget on a version that
  # is not there yet. `sign-attest` is named too: this job is what points
  # installers at the image, and it must not advertise an index nobody signed.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: [preflight, release, docker, sign-attest, npm, pypi, nuget, verify-published]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets
      id-token: write # mcp-publisher login github-oidc
      attestations: read # verify the .mcpb provenance before hashing it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      # Only the bundle and the checksums: this job stamps server.json and
      # publishes it, and the binaries are not its business.
      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh "${RELEASE_TAG#v}" dist "libgen-mcp.mcpb"

      # Runs in a rehearsal too, and that is the point: this is where the
      # stamper meets a real digest and a real bundle, and a rehearsal that
      # skipped it could not catch the one thing the stamper's refusals exist
      # for. The working tree only — the commit to main is a separate job with
      # a separate credential.
      - name: Pin server.json version and SHA256 hashes
        env:
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}" \
            dist/libgen-mcp.mcpb "${OCI_DIGEST}"
          # Prove the pin landed before anything is published. mcp-publisher reads
          # server.json, so a pin that silently no-opped would publish the previous
          # version — and the duplicate-version guard below would then report that
          # as "already published" and let the release go green with the registry
          # never advancing. Fail here, where the cause is still obvious.
          PINNED=$(jq -r '.version' server.json)
          if [ "${PINNED}" != "${VERSION}" ]; then
            echo "::error::server.json says ${PINNED} but the tag is ${VERSION}; refusing to publish"
            exit 1
          fi
          STALE=$(jq -r --arg v "${VERSION}" \
            '[.packages[] | select((.version // $v) != $v)] | length' server.json)
          if [ "${STALE}" -ne 0 ]; then
            echo "::error::${STALE} of server.json's package entries are not at ${VERSION}"
            exit 1
          fi
          echo "server.json pinned to ${VERSION} (top level and all packages)"

      # Publishing to the public MCP Registry only makes sense once the repo and
      # its release assets are public. This step auto-skips while the repo is
      # private and activates automatically when it is made public.
      - name: Publish to MCP Registry
        if: ${{ env.REHEARSAL != 'true' && github.event.repository.private == false }}
        env:
          MCP_PUBLISHER_VERSION: "v1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          TARBALL="mcp-publisher_linux_amd64.tar.gz"
          SIGSTORE_BUNDLE="${TARBALL}.sigstore.json"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${TARBALL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${TARBALL}" "${URL}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${SIGSTORE_BUNDLE}" "${URL}.sigstore.json"
          echo "${MCP_PUBLISHER_SHA256}  ${TARBALL}" | sha256sum -c -
          cosign verify-blob \
            --bundle "${SIGSTORE_BUNDLE}" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${TARBALL}"
          tar xzf "${TARBALL}" mcp-publisher
          ./mcp-publisher login github-oidc
          VERSION="${RELEASE_TAG#v}"
          set +e
          STATUS=1
          for attempt in 1 2 3 4 5 6 7 8; do
            ./mcp-publisher publish 2>&1 | tee mcp-publisher-publish.log
            STATUS=${PIPESTATUS[0]}
            [ "${STATUS}" -eq 0 ] && break
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              break
            fi
            # The registry validates every package entry by fetching what the
            # steps above published minutes ago: the npm entry by reading
            # `mcpName` off the published package, the PyPI one by GETting
            # pypi.org's JSON for this version, the NuGet one by reading that
            # version's README off the v3 feed. nuget.org runs a validation
            # pass of its own on every push before the version becomes
            # visible, so "wait for validation to complete" is propagation lag
            # by construction rather than a broken release. Retry only the
            # wordings the registry itself labels transient; a plain 404 is
            # deliberately absent, so a package that genuinely was not
            # published fails on the first attempt instead of eight minutes
            # later. The OCI entry's own 404 is absent for the same reason —
            # the image was pushed by the job this one needs.
            if grep -qE "take a moment to appear|retry later|retry shortly|validation timed out|wait for validation to complete" mcp-publisher-publish.log; then
              echo "::notice::the registry has not caught up with this release yet (attempt ${attempt}); retrying in 60s"
              sleep 60
              continue
            fi
            break
          done
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            # A duplicate here can only be a duplicate of this tag: the pin step
            # above refuses to continue unless server.json carries ${VERSION}, so
            # there is no longer a path where a stale manifest re-offers an older
            # version and hides behind this branch. Matching the registry's error
            # text alone therefore keeps re-runs idempotent without reopening that
            # hole — the guard that closes it is the assertion, not this grep.
            if grep -q "invalid version: cannot publish duplicate version" mcp-publisher-publish.log; then
              echo "::notice::MCP Registry already has ${VERSION}; this is a re-run, continuing"
            else
              exit "${STATUS}"
            fi
          elif ! grep -qF "version ${VERSION}" mcp-publisher-publish.log; then
            # A zero exit is not on its own proof that the intended version went out.
            echo "::error::mcp-publisher succeeded but did not report version ${VERSION}"
            cat mcp-publisher-publish.log
            exit 1
          fi
          echo "::notice::MCP Registry now serves ${VERSION} as the latest version"

  # Last, deliberately. The commit lands the stamped server.json on main, and a
  # push to main runs check-server-json-packages, which fetches every package
  # the manifest declares. Committing before npm, PyPI and NuGet have published
  # would fail that gate on a version that is merely not there yet. Depending on
  # the publishers also preserves the old single-job semantics: a failed publish
  # aborted before the commit ever happened.
  #
  # It holds the deploy key alone and runs no third-party code — no build
  # action, no CLI resolved at run time — which is the point of it being a job
  # rather than the tail of one that does.
  commit-manifests:
    name: Commit manifests to main
    needs: [preflight, release, docker, sign-attest, npm, pypi, nuget, homebrew, mcp-registry, verify-published]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read # download the published release assets; the push uses the deploy key
      attestations: read # verify the .mcpb provenance before hashing it
    steps:
      # main, not the tag: main is what the commit lands on, so this job runs
      # main's scripts against this release's assets. A change to a script this
      # job calls is therefore only rehearsed once it is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal
      - name: Fetch and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh "${RELEASE_TAG#v}" dist "libgen-mcp.mcpb"

      - name: Commit pinned server.json back to main
        if: ${{ env.REHEARSAL != 'true' && github.event.repository.private == false }}
        env:
          RELEASE_DEPLOY_KEY_B64: ${{ secrets.RELEASE_DEPLOY_KEY_B64 }}
          OCI_DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          # main is protected by a ruleset. Push over SSH with a write-enabled
          # deploy key, which the ruleset's DeployKey bypass allows.
          if [ -z "${RELEASE_DEPLOY_KEY_B64:-}" ]; then
            echo "::warning::RELEASE_DEPLOY_KEY_B64 not set — skipping the server.json pin-back to main."
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/release_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/known_hosts"
          echo "${RELEASE_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}" 2>/dev/null

          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git config core.sshCommand "ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The checkout is already main; refresh it in case another job of
          # this release landed something while this one waited.
          git fetch origin main
          git reset --hard origin/main
          # The script is idempotent and reads checksums.txt, the version and
          # the bundle — all of which were checked against this release's
          # cosign-signed manifest by the fetch step above — so running it here
          # on current main produces the same fields the registry job stamped.
          bash scripts/update-server-json-sha.sh dist/checksums.txt "${VERSION}" \
            dist/libgen-mcp.mcpb "${OCI_DIGEST}"
          # Every manifest the script stamps, not just the two it stamped first;
          # `if` rather than `[ -f … ] &&`, whose non-zero status would abort the
          # step under `set -e` the day a manifest is renamed away.
          for manifest in server.json lhm.plugin.json mcpb/manifest.json .plugin/plugin.json plugin.json npm/libgen-mcp/package.json; do
            if [ -f "${manifest}" ]; then git add "${manifest}"; fi
          done
          if git diff --cached --quiet; then
            echo "::notice::No manifest changes to commit"
            exit 0
          fi
          git commit -m "chore: stamp v${VERSION} into the version-bearing manifests"
          git push origin main

  docker:
    name: Docker
    needs: [preflight, transport-e2e, race]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    # The digest of the image index, which the release job stamps into
    # server.json's two OCI identifiers. One value for both registries: the
    # multi-platform build is pushed once and ghcr.io and Docker Hub hold the
    # identical index.
    #
    # In a rehearsal it is the digest of the index exported to a tarball, read
    # back by the step below, so the stamping step downstream runs on a real
    # value rather than being skipped — which is the only way a rehearsal can
    # exercise the refusals that exist for exactly this field.
    outputs:
      digest: ${{ steps.rehearsal-digest.outputs.digest || steps.docker-push.outputs.digest }}
      # The two platform manifests the index lists, read once here and handed
      # on, so the signing job does not inspect the registry a second time.
      # Every attestation subject downstream is one of these three digests.
      amd64: ${{ steps.platform-digests.outputs.amd64 }}
      arm64: ${{ steps.platform-digests.outputs.arm64 }}
      # Whether Docker Hub was configured at all, so the signing job reaches
      # the same conclusion without being given the credentials to ask.
      dockerhub: ${{ steps.dockerhub-login.outputs.skip }}
    permissions:
      contents: read # checkout
      packages: write # ghcr.io push, through the GITHUB_TOKEN login below
      # No id-token and no attestations. This job runs QEMU, BuildKit and
      # whatever the Dockerfile pulls; the credential the attestation store
      # trusts must not be live while that runs, so signing is a job of its
      # own. It is also what keeps "re-run failed jobs" from rebuilding the
      # image: a failed signature re-runs the signing, and no tag moves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract version
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      # cosign is here to *verify* a download — syft's own signed checksums,
      # below — and for nothing else. This job has no `id-token`, so there is
      # no keyless identity to sign with even if a step tried to; signing lives
      # in sign-attest, which runs none of the build code this job does.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # The registry logins run in a rehearsal too. They mint a credential and
      # spend nothing, and a policy that has drifted is exactly the kind of
      # failure a rehearsal is for; only the push below is skipped.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Docker Hub credentials
        id: dockerhub-login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — skipping Docker Hub publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.dockerhub-login.outputs.skip == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Nothing is published until both images have been started. `load: true`
      # takes one platform per build, which is why this is two steps rather
      # than the multi-platform build below; the push reuses their layers from
      # the gha cache, so the second build of each is a cache hit rather than a
      # second compile.
      - name: Build linux/amd64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: libgen-mcp:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
      - name: Build linux/arm64 for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: libgen-mcp:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
      - name: Smoke test both architectures
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/smoke-test-image.sh "${EXPECTED_VERSION}" \
            libgen-mcp:smoke-amd64=linux/amd64 \
            libgen-mcp:smoke-arm64=linux/arm64
      # In a rehearsal the same multi-platform build, with the same provenance
      # and SBOM, is exported to an OCI layout on the runner instead of pushed:
      # the image index that would have gone to the registry exists, so its
      # digest is real and the stamping step pins it, and nothing has left the
      # machine.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: docker-push
        with:
          context: .
          push: ${{ env.REHEARSAL != 'true' }}
          outputs: ${{ env.REHEARSAL == 'true' && format('type=oci,dest={0}/rehearsal-image.tar', runner.temp) || '' }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: type=gha
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.date }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:{1}', env.DOCKERHUB_IMAGE, steps.version.outputs.version) || '' }}
            ${{ steps.dockerhub-login.outputs.skip == 'false' && format('docker.io/{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
      # Rehearsal only: the action reports the exported index's digest the same
      # way it reports a pushed one, and the OCI layout's own index.json is read
      # if it does not, so the stamping step never runs on an empty value.
      - name: Read the rehearsed image's digest
        id: rehearsal-digest
        if: env.REHEARSAL == 'true'
        env:
          BUILT_DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${BUILT_DIGEST}"
          if [ -z "$digest" ]; then
            digest=$(tar -xOf "${RUNNER_TEMP}/rehearsal-image.tar" index.json | jq -r '.manifests[0].digest')
          fi
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the OCI export reported no digest (got '${digest}')"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "rehearsed image index ${digest}, exported to a tarball and pushed nowhere"

      # The two platform manifests the pushed index lists. Read here rather
      # than in the signing job so the registry is inspected once, and
      # published as job outputs because a verifier does not agree with itself
      # about which digest "the image" is: `gh attestation verify oci://`
      # resolves a tag to the index, while a scanner that pulls the image for
      # its own platform resolves the index to one platform manifest and looks
      # for referrers of that digest instead.
      - name: Read the platform manifest digests
        id: platform-digests
        if: env.REHEARSAL != 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker-push.outputs.digest }}
        run: |
          set -euo pipefail
          index=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}')
          for arch in amd64 arm64; do
            digest=$(jq -r --arg a "$arch" \
              '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest][0] // ""' \
              <<< "$index")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::the pushed index lists no linux/${arch} manifest (got '${digest}')"
              exit 1
            fi
            echo "${arch}=${digest}" >> "$GITHUB_OUTPUT"
            echo "linux/${arch} manifest ${digest}"
          done

      # An SBOM of the image, discoverable by a reader of the registry, beside
      # the one BuildKit already writes. `sbom: true` on the build puts an SPDX
      # document *inside* the index as an attestation manifest, one per
      # platform, and a client reading the registry's referrers never sees it:
      # those two `unknown/unknown` manifests are part of the index rather than
      # referrers of anything. Both are kept — they answer different readers
      # and neither replaces the other.
      #
      # Per platform rather than over the index, because an SBOM describes
      # contents and an index has none of its own: it lists manifests, and the
      # two platform images have different contents. The platform digest is
      # also what a scanner that pulled the image for its own architecture
      # looks under, which is why the provenance steps cover those digests too.
      #
      # syft is fetched by hand for the reason spelled out at the release job's
      # own copy of this install, and pinned the same way.
      #
      # Not gated on the rehearsal switch. This install, the scan and the guard
      # below are the whole of the feature that can rot, and a rehearsal is the
      # only thing that runs them before a tag does; gated, a typo here would
      # fail for the first time on a release, after the image was pushed.
      - name: Install syft
        env:
          SYFT_SHA256: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
        run: |
          set -euo pipefail
          # In the runner's temp directory, not the checkout: GoReleaser
          # refuses a dirty tree on a tag, and the tarball and its four
          # signature files would be exactly that if a step here failed
          # between the download and the cleanup.
          cd "${RUNNER_TEMP}"
          TARBALL="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          BASE="https://github.com/anchore/syft/releases/download/${SYFT_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${SYFT_SHA256}  ${TARBALL}" | sha256sum -c -
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.txt "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.pem "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.pem"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o syft-checksums.sig "${BASE}/syft_${SYFT_VERSION#v}_checksums.txt.sig"
          base64 -d syft-checksums.pem > syft-checksums.decoded.pem
          cosign verify-blob \
            --certificate syft-checksums.decoded.pem \
            --signature syft-checksums.sig \
            --certificate-identity "https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            syft-checksums.txt
          # Strict, unlike oras's cross-check below: this file is the one cosign
          # signed, so fetching it is how the provenance claim is made at all,
          # not a second opinion about a pin that already matched.
          grep " ${TARBALL}\$" syft-checksums.txt | sha256sum -c -
          tar xzf "${TARBALL}" syft
          install -m 0755 syft /usr/local/bin/syft
          rm -f "${TARBALL}" syft-checksums.txt syft-checksums.pem syft-checksums.decoded.pem syft-checksums.sig syft
          syft --version

      # Scanned from ghcr.io alone: both registries hold the byte-identical
      # index, so a platform digest names the same bytes on either and one
      # document is what gets attested to both. `--platform` beside the digest
      # is for the document's own record — a manifest digest already names one
      # platform's bytes, but syft learns the architecture only from the flag,
      # and without it the image purl carries an empty arch qualifier.
      #
      # A rehearsal pushes nothing, so there is no registry image to scan; it
      # scans the two smoke images the daemon already holds, built from the
      # same layers and listing the same packages. The attest steps stay
      # skipped there: an attestation whose subject exists nowhere would be
      # pollution of the store rather than a rehearsal of it.
      - name: Generate the per-platform image SBOMs
        env:
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          AMD64_DIGEST: ${{ steps.platform-digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platform-digests.outputs.arm64 }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) digest="${AMD64_DIGEST}" ;;
              arm64) digest="${ARM64_DIGEST}" ;;
            esac
            if [ "$REHEARSAL" = "true" ]; then
              source="docker:libgen-mcp:smoke-${arch}"
              syft scan "$source" -o spdx-json > "image-sbom-${arch}.spdx.json"
            else
              source="registry:${IMAGE_REPO}@${digest}"
              syft scan "$source" --platform "linux/${arch}" -o spdx-json > "image-sbom-${arch}.spdx.json"
            fi
            # A document with no packages means syft read nothing, which would
            # attest an empty claim rather than fail.
            packages=$(jq '.packages | length' "image-sbom-${arch}.spdx.json")
            if [ "${packages:-0}" -lt 1 ]; then
              echo "::error::the ${arch} SBOM lists no packages; syft scanned nothing"
              exit 1
            fi
            echo "linux/${arch}: ${packages} packages from ${source}"
          done

      # The documents cross to sign-attest as an artifact rather than being
      # attested here, because the signing identity is no longer in this job.
      # A rehearsal uploads too: the upload is part of the path a release takes
      # and costs a few hundred kilobytes.
      - name: Keep the SBOMs for the signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-sboms
          path: image-sbom-*.spdx.json
          retention-days: 1
          if-no-files-found: error

      # The Docker Hub repository descriptions are owned by this repo so they
      # cannot drift (they had been empty since the repository was published,
      # across thousands of pulls): the short description and the curated
      # description file are re-pushed on every release, right after the
      # image publish. The full README (~50KB) exceeds Docker Hub's 25,000
      # character limit, so .github/dockerhub-description.md carries the
      # Docker-relevant sections. DOCKERHUB_TOKEN must be a Docker Hub PAT
      # with read/write/delete scope — the descriptions API rejects narrower
      # ones.
      - name: Update Docker Hub description
        if: env.REHEARSAL != 'true' && steps.dockerhub-login.outputs.skip == 'false'
        # Pinned to a commit SHA (unlike the org-owned actions above) because
        # this is an individually-maintained action that receives
        # DOCKERHUB_TOKEN — a mutable tag would let a compromised release
        # exfiltrate it.
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "MCP server to search and read Library Genesis and open-access sources. By jmrp.io"
          readme-filepath: ./.github/dockerhub-description.md

  # Signing and attestation, in a job of their own, for two reasons that both
  # bite in practice.
  #
  # The first is what a re-run does. The docker job builds and pushes, and its
  # build is not byte-reproducible: BuildKit's `provenance: true` attestation
  # carries its own timestamps whatever the build args say. With the signing
  # inside that job, one signature failing meant "re-run failed jobs" rebuilt
  # the image and pushed a NEW index under the same version and `latest` tags —
  # orphaning the index that had already been signed and leaving server.json
  # pinning a digest the tag no longer resolves to. Here a failed signature
  # re-runs two minutes of signing against the image that is already published,
  # and no tag moves. An immutable GitHub release does not help: the thing that
  # moves is a registry tag.
  #
  # The second is who holds the identity. This job runs no third-party build
  # action — no QEMU, no BuildKit, no Dockerfile. The docker job keeps
  # `packages: write` and loses `id-token`, so the credential the attestation
  # store trusts is no longer live while code fetched at build time runs.
  sign-attest:
    name: Sign and attest
    needs: [preflight, docker]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      INDEX_DIGEST: ${{ needs.docker.outputs.digest }}
      AMD64_DIGEST: ${{ needs.docker.outputs.amd64 }}
      ARM64_DIGEST: ${{ needs.docker.outputs.arm64 }}
      DOCKERHUB_SKIP: ${{ needs.docker.outputs.dockerhub }}
    permissions:
      contents: read # checkout, for the signing script
      packages: write # the referrer writes push-to-registry makes on ghcr.io
      id-token: write # cosign keyless signing, and the attestation identity
      attestations: write # actions/attest-build-provenance itself
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Nothing is signed or attested in a rehearsal, so nothing below runs and
      # this job needs no credential then either.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.REHEARSAL != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Take the SBOMs the docker job generated
        if: env.REHEARSAL != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image-sboms

      # The digests this job was handed must be real before anything is signed
      # against them: a job output that arrived empty would sign the string "@"
      # and fail somewhere far less legible.
      - name: Check the digests the docker job handed over
        if: env.REHEARSAL != 'true'
        run: |
          set -euo pipefail
          for name in INDEX_DIGEST AMD64_DIGEST ARM64_DIGEST; do
            value="${!name}"
            if ! [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${name} is not a sha256 digest (got '${value}')"
              exit 1
            fi
            echo "${name}=${value}"
          done

      - name: Sign the image (ghcr.io)
        if: env.REHEARSAL != 'true'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      - name: Sign the image (Docker Hub)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        env:
          IMAGE_REF: docker.io/${{ env.DOCKERHUB_IMAGE }}@${{ needs.docker.outputs.digest }}
        run: bash .github/scripts/cosign-sign-retry.sh "$IMAGE_REF"

      # The cosign signatures above prove who pushed the index, and their
      # in-toto predicate is empty: they answer "was this pushed by our release
      # job" and not "which commit and which run produced it". That second
      # question is build provenance, which the release assets now answer and
      # the image did not — the only provenance it carried was BuildKit's own
      # `provenance: true` attestation, unsigned in-toto JSON inside the index,
      # bound to no verifiable identity.
      #
      # Three subjects per registry: the index and the two platform manifests
      # it lists. Both registries hold the byte-identical index, so the same
      # three digests serve both and the steps differ only in the name they are
      # bound to. `push-to-registry` attaches each attestation to its subject
      # as well as storing it in GitHub's store, because a scanner reading a
      # registry cannot see that store; it changes the subject's referrers and
      # never the subject itself, so the digest server.json pins is untouched
      # and no re-stamp is needed.
      #
      # The platform manifests are attested as well as the index because a
      # verifier does not agree with itself about which digest "the image" is.
      # `gh attestation verify oci://` resolves a tag to the index and asks
      # GitHub's store about that digest; a scanner that pulls the image for
      # its own platform resolves the index to one platform manifest and looks
      # for referrers of THAT digest, and an index-only attestation is
      # invisible to it. It is the same asymmetry `cosign sign --recursive`
      # already covers for the signature.
      #
      # `docker.io/...` is the right spelling even though https://docker.io/v2/
      # serves no registry API: actions/attest canonicalizes any registry
      # ending in docker.io to registry-1.docker.io before it builds its client
      # and when it looks up the login credential.
      #
      # Verify: gh attestation verify oci://<ref>@<digest> -R jmrplens/libgen-mcp
      - name: Attest build provenance (ghcr.io, index)
        if: env.REHEARSAL != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (ghcr.io, linux/amd64)
        if: env.REHEARSAL != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.amd64 }}
          push-to-registry: true

      - name: Attest build provenance (ghcr.io, linux/arm64)
        if: env.REHEARSAL != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.arm64 }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub, index)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub, linux/amd64)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.amd64 }}
          push-to-registry: true

      - name: Attest build provenance (Docker Hub, linux/arm64)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.arm64 }}
          push-to-registry: true

      # `actions/attest` itself rather than the `actions/attest-sbom` wrapper,
      # which is deprecated and says so with a warning on every run.
      #
      # `predicate-type` + `predicate-path` rather than `sbom-path`. sbom-path
      # does two things: it checks the file is SPDX or CycloneDX, which the
      # docker job's package-count guard already covers, and it derives the
      # predicate type from `spdxVersion`, which yields
      # https://spdx.dev/Document/v2.3. The in-toto specification blesses that
      # spelling and the unversioned https://spdx.dev/Document equally — both
      # are listed as Type URIs — so this is interoperability, not correctness.
      # It matters because Trivy matches the unversioned literal by exact
      # equality: the versioned form is read as "unknown" and refused. cosign,
      # BuildKit and in-toto-golang all emit the unversioned form.
      #
      # Six steps, the index included. An index has no contents of its own, so
      # the index attestation carries the amd64 document by convention rather
      # than by right — and it is there because a consumer that resolves a tag
      # looks at the index and nowhere else: with the SBOM on the platform
      # manifests alone, `trivy image <tag>` finds nothing and `--platform`
      # does not change it.
      - name: Attest SBOM (ghcr.io, index)
        if: env.REHEARSAL != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (ghcr.io, linux/amd64)
        if: env.REHEARSAL != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.amd64 }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (ghcr.io, linux/arm64)
        if: env.REHEARSAL != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.docker.outputs.arm64 }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-arm64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (Docker Hub, index)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (Docker Hub, linux/amd64)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.amd64 }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-amd64.spdx.json
          push-to-registry: true

      - name: Attest SBOM (Docker Hub, linux/arm64)
        if: env.REHEARSAL != 'true' && env.DOCKERHUB_SKIP == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ needs.docker.outputs.arm64 }}
          predicate-type: https://spdx.dev/Document
          predicate-path: image-sbom-arm64.spdx.json
          push-to-registry: true

      # oras is fetched by hand for the reason spelled out at syft's install,
      # and pinned the same way. Unlike syft it publishes no cosign signature,
      # only a detached GPG one, so the certificate check has no counterpart
      # here and the SHA256 is the binding control: it names the exact bytes,
      # and the release's own checksums file is cross-checked against it so a
      # mismatch says which of the two moved.
      #
      # Not gated on the rehearsal switch, for the same reason syft's is not:
      # this is the only thing that exercises the download and the pin before a
      # tag does.
      - name: Install oras
        env:
          ORAS_SHA256: "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454"
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}" # same reason as syft's install: never in the checkout
          TARBALL="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o "${TARBALL}" "${BASE}/${TARBALL}"
          echo "${ORAS_SHA256}  ${TARBALL}" | sha256sum -c -
          # The pin above is the control, and it has already passed here. This
          # second fetch only cross-checks it against the publisher's own
          # manifest so a mismatch says which of the two moved, and a release
          # must not stop because that file was briefly unreachable: a rehearsal
          # lost the whole signing job to three HTTP 500s from
          # github.com/oras-project/oras/releases while the tarball itself had
          # downloaded and matched. A 500 is a fact about GitHub; a mismatch is
          # a fact about the bytes, and only the second one still fails.
          if curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors -o oras-checksums.txt "${BASE}/oras_${ORAS_VERSION}_checksums.txt"; then
            grep " ${TARBALL}\$" oras-checksums.txt | sha256sum -c -
          else
            echo "::warning title=oras checksums::could not fetch ${BASE}/oras_${ORAS_VERSION}_checksums.txt; the SHA256 pin matched, so the bytes are the pinned ones and only the cross-check against the publisher's manifest was skipped"
          fi
          tar xzf "${TARBALL}" oras
          install -m 0755 oras /usr/local/bin/oras
          rm -f "${TARBALL}" oras-checksums.txt oras
          oras version

      # A second, unsigned copy of the same documents, published bare, beside
      # the attestations above and never instead of them. The attestation is
      # the authenticated answer and needs a Sigstore verifier to unwrap four
      # layers; this is the one a consumer reads with one referrers query and
      # one blob GET, and its artifactType is the registered SPDX media type
      # rather than a signature-container type that says nothing about what is
      # inside.
      #
      # Last, and after every attestation, for two reasons: all of these
      # clients maintain the referrers fallback tag by read-modify-write, so
      # they must be sequential; and a failure in the unsigned copy then cannot
      # cost the signed ones. oras reads the credentials docker/login-action
      # already wrote and needs none of its own.
      - name: Publish the SBOMs as bare SPDX referrers
        if: env.REHEARSAL != 'true'
        env:
          GHCR_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          HUB_REPO: ${{ env.DOCKERHUB_SKIP == 'false' && format('docker.io/{0}', env.DOCKERHUB_IMAGE) || '' }}
        run: |
          set -euo pipefail
          for repo in "${GHCR_REPO}" ${HUB_REPO:+"${HUB_REPO}"}; do
            for pair in "${INDEX_DIGEST}:amd64" "${AMD64_DIGEST}:amd64" "${ARM64_DIGEST}:arm64"; do
              digest="${pair%:*}"
              arch="${pair##*:}"
              oras attach --artifact-type application/spdx+json \
                "${repo}@${digest}" \
                "image-sbom-${arch}.spdx.json:application/spdx+json"
              echo "attached ${arch} SBOM to ${repo}@${digest}"
            done
          done

      # ghcr.io only, and last of all. It serves no referrers API, so the
      # referrers list there is the client-maintained sha256-<hex> fallback
      # tag, and an entry in it says only what the client that appended it
      # wrote. The distribution spec says that descriptor MUST carry the pushed
      # manifest's artifactType and copy all of its annotations; cosign writes
      # it through go-containerregistry, whose releases before v0.22.1 wrote
      # less — so a signature lands in the list as
      # "application/vnd.oci.empty.v1+json" with no annotations. The manifest
      # behind it is right; the list entry is not, and `gh attestation verify
      # --bundle-from-oci`, Kyverno and Trivy all filter on exactly those
      # fields.
      #
      # A failure here warns and does not fail the job. This job gates every
      # publisher, and that gate exists so an image nobody signed never ships
      # beside versions that cannot be withdrawn. Every signature and
      # attestation above stands whatever happens here, and a tag whose entries
      # are what cosign wrote is what every earlier release shipped with;
      # holding the publishers for a list entry would price it as a signature.
      # The warning names the command to run by hand.
      - name: Make the ghcr.io referrers fallback tags say what they list
        if: env.REHEARSAL != 'true'
        env:
          GHCR_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -uo pipefail
          if ! bash .github/scripts/referrers-fallback-repair.sh "${GHCR_REPO}" "${INDEX_DIGEST}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"; then
            echo "::warning title=ghcr.io referrers fallback tags::not rewritten; the signatures and attestations stand and the entries are what cosign wrote. Run by hand: bash .github/scripts/referrers-fallback-repair.sh ${GHCR_REPO} ${INDEX_DIGEST} ${AMD64_DIGEST} ${ARM64_DIGEST}"
          fi

      # A skipped job with a message rather than a hole in the graph: reading a
      # rehearsal's job list should not suggest the signing was forgotten.
      - name: Nothing to sign in a rehearsal
        if: env.REHEARSAL == 'true'
        run: |
          echo "::notice::rehearsal: the image was exported rather than pushed, so there is no published index to sign or attest; the SBOMs were still generated and their guard still ran in the docker job, and syft's and oras's pinned installs still ran"

  # Homebrew is the fastest path from a tag to a running binary on somebody's
  # machine, so it waits for the release job: a tap that advertises a version
  # whose packages failed to publish is worse than a tap one release behind.
  #
  # It holds the tap's deploy key and runs no third-party code, which is why it
  # is a job of its own rather than a step beside the publishes.
  homebrew:
    name: Homebrew tap
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Take the rehearsal's own build
        if: env.REHEARSAL == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rehearsal-assets
          path: ${{ runner.temp }}/rehearsal

      # The formula's sha256 lines are only as trustworthy as where they came
      # from, so on a real release the manifest is downloaded with its sigstore
      # bundle and verified before a single hash is read out of it. Only the
      # manifest: the formula names URLs, and the binaries themselves are no
      # business of this job.
      - name: Fetch and verify the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REHEARSAL_ARCHIVE: ${{ env.REHEARSAL == 'true' && format('{0}/rehearsal/rehearsal-assets.tar', runner.temp) || '' }}
        run: bash scripts/fetch-release-assets.sh --checksums-only "${RELEASE_TAG#v}" dist

      - name: Update the tap formula
        env:
          # Withheld from a rehearsal, not merely unused by it: the tap is
          # cloned read-only over https and the commit is shown rather than
          # pushed, so the step has no reason to hold the key.
          TAP_DEPLOY_KEY_B64: ${{ env.REHEARSAL != 'true' && secrets.TAP_DEPLOY_KEY_B64 || '' }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ "$REHEARSAL" = "true" ]; then
            TAP_REPO=https://github.com/jmrplens/homebrew-tap.git \
              bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" \
                "${RUNNER_TEMP}/homebrew-tap" --dry-run
            exit 0
          fi
          # The tap repository and its deploy key are set up once, by hand. Until
          # then a release is not held up by a channel that does not exist yet.
          if [ -z "${TAP_DEPLOY_KEY_B64}" ]; then
            echo "::warning::TAP_DEPLOY_KEY_B64 is not configured — skipping the Homebrew tap update"
            exit 0
          fi
          KEY_FILE="${RUNNER_TEMP}/tap_deploy_key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/tap_known_hosts"
          echo "${TAP_DEPLOY_KEY_B64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -H github.com > "${KNOWN_HOSTS_FILE}" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
          bash scripts/update-homebrew-tap.sh dist/checksums.txt "${VERSION}" "${RUNNER_TEMP}/homebrew-tap"

  # winget opens a pull request against microsoft/winget-pkgs, so nothing here
  # can run dry and a rehearsal skips the job whole. `env` is not readable in a
  # job-level `if`, hence the event test.
  winget:
    name: Winget
    needs: [release]
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    permissions: {} # both steps authenticate with WINGET_TOKEN, not GITHUB_TOKEN
    steps:
      - name: Check the winget credentials
        id: winget-token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::WINGET_TOKEN is not configured — skipping the winget submission."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The fork MUST be synced before the releaser runs: komac creates its
      # branch on the fork, and a stale fork fails with "Ref cannot be created",
      # which the releaser's continue-on-error would then hide. This step is
      # deliberately blocking — nothing downstream depends on this job, so a red
      # winget job is the visibility a silently skipped submission lacks.
      - name: Sync the winget-pkgs fork with upstream
        if: steps.winget-token.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh api -X POST repos/jmrplens/winget-pkgs/merge-upstream -f branch=master

      # Only works once the initial manifest for jmrplens.libgen-mcp has been
      # accepted upstream, which is a one-time manual submission;
      # continue-on-error keeps releases green until then, and when Microsoft's
      # validation service hiccups.
      #
      # Pinned to a commit SHA because this is an individually-maintained action
      # that receives WINGET_TOKEN — a mutable tag would let a compromised
      # release exfiltrate it.
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        if: steps.winget-token.outputs.skip == 'false'
        continue-on-error: true
        with:
          identifier: jmrplens.libgen-mcp
          installers-regex: '-windows-(amd64|arm64)\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
