# Live end-to-end tests against the real Library Genesis site.
#
# The suite in test/e2e/ is gated behind LIBGEN_E2E=1 + a reachability probe;
# it politely skips when the site is unreachable, so a green run means
# "passed or skipped". Runs nightly and on demand — never on push/PR, to avoid
# hammering libgen from every build.

name: E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"

jobs:
  e2e:
    name: Live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run live E2E suite
        env:
          LIBGEN_E2E: "1"
        run: |
          mkdir -p test-results
          # The suite's runtime scales with how many upstreams are unreachable: a
          # source that has gone dark burns its full resolve budget on every mirror
          # before the chain advances, and the tests classify that as a known
          # outcome rather than a failure. At 600s a single dark source (annas,
          # ~93s per attempt) was enough to exhaust the budget mid-suite and panic.
          # Kept strictly under the job's timeout-minutes so `go test` times out
          # first and prints the goroutine dump, instead of the runner killing the
          # job with no diagnosis.
          gotestsum --junitfile test-results/e2e-junit.xml --format standard-verbose \
            -- -v -tags e2e -timeout 900s -count=1 ./test/e2e/
      # A live suite reports two ways: red, and quietly not having run. Every
      # per-source case skips when its upstream will not serve this network, and
      # a runner's datacenter address is exactly what some of them decline —
      # Internet Archive Scholar answers CI with a session challenge. Those skips
      # are correct, but a green tick hides them, and coverage that lapses for
      # weeks looks identical to coverage that passed. Surface them so the run
      # says what it did NOT check.
      - name: Report skipped coverage
        if: always()
        run: |
          set -euo pipefail
          f=test-results/e2e-junit.xml
          [ -f "$f" ] || exit 0
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import re, sys, pathlib
          xml = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          cases = re.findall(r'<testcase\b[^>]*name="([^"]+)"[^>]*(?:/>|>(.*?)</testcase>)', xml, re.S)
          skipped = []
          for name, body in cases:
              body = body or ""
              if "<skipped" in body:
                  why = re.search(r'<skipped[^>]*message="([^"]*)"', body)
                  skipped.append((name, (why.group(1) if why else "").strip()[:160]))
          total = len(cases)
          print(f"### Live E2E: {total - len(skipped)} exercised, {len(skipped)} skipped\n")
          if not skipped:
              print("Every case ran — no upstream declined to serve this runner.")
          else:
              print("These cases did **not** exercise their upstream:\n")
              print("| Case | Reason |")
              print("| --- | --- |")
              for name, why in sorted(skipped):
                  print(f"| `{name}` | {why.replace('|', '\\|') or '—'} |")
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14
